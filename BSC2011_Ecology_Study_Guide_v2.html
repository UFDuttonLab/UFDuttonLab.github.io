  {"q": "A nitrogen atom in a soil nitrate ion ends up back in the atmosphere as N₂ gas. Which process moved it there, and what kind of organism carries that process out?", "c": ["Nitrogen fixation, carried out by bacteria living in legume root nodules", "Denitrification, carried out by a specialized group of microbes", "Decomposition, carried out by fungi breaking down dead leaves and roots", "Transpiration, carried out by plants releasing gases through their stomata", "Industrial fixation, carried out in factories that manufacture fertilizer"], "correct": 1, "explanation": "Slide 45 notes: nitrogen fixation moves N₂ out of the atmosphere into usable forms, and 'the reverse process happens with another group of microbes that do denitrification that puts N₂ back into the atmosphere,' in both oceans and on land. Fixation, decomposition and industrial fixation all move nitrogen in the other direction or between non-gaseous pools.", "t": 9, "src": "09:45"},
  {"q": "Over one year the plants of a grassland fix 1,200 g C/m² through photosynthesis and respire 600 g C/m² to fuel their own metabolism. What is the grassland's net primary production (NPP) for that year?", "c": ["1,800 g C/m² per year, because plant respiration adds to production", "600 g C/m² per year, because NPP equals GPP minus plant respiration", "1,200 g C/m² per year, because plant respiration does not affect NPP", "300 g C/m² per year, because NPP is about one quarter of GPP", "0 g C/m² per year, because the plants used up everything they fixed"], "correct": 1, "explanation": "GPP = NPP + Rp, so NPP = GPP − Rp = 1,200 − 600 = 600 g C/m² per year (slide 19). This matches the rule of thumb that NPP is about 50% of GPP for many ecosystems (slide 20). NPP is a rate of new biomass per area per time, not the standing crop.", "t": 9, "src": "09:19-20"},
  {"q": "Lecture contrasted elements that cycle globally with elements that cycle on a more local scale. Which statement correctly applies that distinction?", "c": ["Carbon and nitrogen have gaseous forms that travel through the atmosphere and cycle globally; phosphorus does not, so it cycles more locally", "Phosphorus cycles globally because it dissolves so easily in rain, whereas carbon and nitrogen cycle locally because they are held in living tissue", "Nitrogen cycles locally because N₂ is chemically inert, whereas carbon cycles globally mainly because of fossil fuel burning", "Carbon, nitrogen and phosphorus all cycle on the same scale, because each of them is taken up from the soil by plant roots", "Phosphorus cycles fastest of the three because it is the most soluble, so it moves around the globe within a single year"], "correct": 0, "explanation": "Slide 33 (Ecosystems I): highly mobile gaseous forms of carbon, oxygen and nitrogen occur in the atmosphere and cycle globally, whereas less mobile elements such as phosphorus cycle on a more local level. Phosphorus lacks a significant gaseous component and its cycle is much slower than carbon's or nitrogen's (Ecosystems II, slide 9).", "t": 10, "src": "09:33; 10:9"},
  {"q": "In a grassland plot, a nitrogen-fixing legume raises the growth of the non-legume grasses planted beside it. In the framework from lecture, this facilitation is counted as part of which mechanism linking biodiversity to ecosystem function?", "c": ["The sampling effect, because the legume happens to be the most productive species in the pool", "Complementarity, because the positive interaction lets the mixture capture more resources", "The insurance effect, because the legume compensates for the grasses whenever they fail", "Competitive exclusion, because the legume will eventually replace the grasses it outgrows", "The portfolio effect, because the legume spreads the risk of a bad year across more species"], "correct": 1, "explanation": "Slide 44 lists facilitation under complementarity: 'Includes facilitation, e.g., nitrogen-fixing legumes boost neighbors.' Legumes convert N₂ into plant-available nitrogen that benefits non-fixing neighbors, so the mixture captures more resources than any monoculture. The sampling effect is a probability effect, and the insurance (portfolio) effect concerns stability across years, not mean productivity.", "t": 10, "src": "10:44"},
  {"q": "The sampling (selection) effect explains higher productivity in diverse communities because:", "c": ["A community drawn from more species is more likely, by chance alone, to include a highly productive species that dominates", "Every species in a diverse community contributes an equal share of the total productivity, so more species means more output", "Species in diverse communities divide resources by rooting depth, so together they use more of the soil profile", "Drought-tolerant species keep producing when drought-sensitive species crash, which stabilizes output from year to year", "Diverse communities contain fewer individuals per species, which reduces competition and lets each plant grow larger"], "correct": 0, "explanation": "Sampling is a probability (\"lottery ticket\") effect, not a species-interaction effect. Resource partitioning is complementarity and compensation under stress is insurance; Cardinale et al. 2012 found roughly 50% sampling, 50% complementarity.", "t": 10},
  {"q": "Which pairing correctly matches an ecosystem FUNCTION with the ecosystem SERVICE that humans derive from it?", "c": ["Function: decomposition of organic matter by soil microbes; Service: fertile soil for growing crops", "Function: a national park entrance fee; Service: tourism revenue", "Function: clean drinking water; Service: filtration of water by wetland plants and soils", "Function: a clean-air law; Service: climate regulation", "Function: medicine extracted from a plant; Service: photosynthesis by the plant"], "correct": 0, "explanation": "An ecosystem function is an ecological process controlling fluxes of energy, nutrients and organic matter (decomposition, water filtration, pollination); the service is the benefit humans get from it (soil fertility, clean water, crop production). Laws, fees and revenues are not ecosystem functions.", "t": 10},
  {"q": "Conservation of genetic diversity within a species is important because it:", "c": ["Makes the individuals in the population genetically identical to one another", "Maintains heritable variation that lets the population adapt to environmental change", "Stops the population from evolving, which keeps it matched to its current environment", "Increases the rate of inbreeding depression by adding more harmful alleles to the gene pool", "Reduces the effective population size by spreading breeding across more individuals"], "correct": 1, "explanation": "Slide 5: smaller populations have less genetic diversity, which reduces the probability that they can handle challenges such as environmental change, climate or disease; slide 9 calls this limited adaptive potential. Genetic diversity is the raw material on which selection acts.", "t": 11},
  {"q": "Effective population size (Nₑ) is a better guide to a population's genetic health than its census size because Nₑ accounts for the fact that:", "c": ["Every individual counted in the census passes an equal share of its genes on to the next generation of the population", "Skewed sex ratios, unequal breeding success and past bottlenecks mean fewer individuals pass on genes than the census shows", "Population density, rather than population size, is what determines how much genetic diversity a population retains", "Immigration and emigration are the main processes that change allele frequencies in a small population", "Predators tend to remove the individuals carrying the rarest alleles before those individuals can reproduce"], "correct": 1, "explanation": "Nₑ is the number of individuals that effectively contribute genes to the next generation and is usually smaller than the census size (slides 7, 28–31). Skewed sex ratios, \"supermoms\" and bottlenecks all lower Nₑ; equal sex ratios and equal breeding success maximize it.", "t": 11},
  {"q": "A reserve holds 60 adult cheetahs. In one generation, 10 males and 30 females actually breed. Using Nₑ = 4NₘNf / (Nₘ + Nf), what is the effective population size?", "c": ["60, the same as the census size", "40, the number of adults that bred", "30, half of the census size", "20, twice the number of breeding males", "15, half of the number that bred"], "correct": 2, "explanation": "Nₑ = 4(10)(30) / (10 + 30) = 1,200 / 40 = 30. Only 40 of the 60 adults bred, and the skewed sex ratio lowers Nₑ further, so the population behaves genetically like one of 30 individuals, as in the lecture's cheetah examples (slides 32-33), where 16 animals with 5 breeding males and 2 breeding females gave Nₑ ≈ 5.7.", "t": 11, "src": "11:31-33"},
  {"q": "Managers notice that a subpopulation has persisted for 20 years even though its deaths have exceeded its births in every year. The best explanation is that it is:", "c": ["A source population whose surplus offspring leave each year as emigrants to other patches", "A sink population kept alive by immigrants arriving from a source where births exceed deaths", "A closed population that follows the BD model, with no movement into or out of the patch", "A population whose carrying capacity has risen every year, allowing it to absorb the losses", "A population that was miscounted, since a population with r below zero cannot persist"], "correct": 1, "explanation": "In the source–sink model (slides 39–41) a sink is a patch where mortality exceeds reproduction; it would decline to extinction without immigrants, so persistence with r &lt; 0 is the signature of a sink connected to a source. The closed BD model cannot describe it; the BIDE model is needed (slide 42).", "t": 11},
  {"q": "A county converts most of its pine flatwoods to subdivisions, leaving the remaining forest as small patches separated by roads. Which driver of biodiversity loss does this represent, and what additional risk does the patchiness create?", "c": ["Pollution; chemical runoff from the new roads poisons the amphibians that breed in flatwoods ponds", "Introduced species; ornamental plants from the subdivisions escape and outcompete the native flora", "Habitat loss and fragmentation; the isolated patches leave small populations exposed to drift, inbreeding and chance", "Overharvesting; the timber cut during construction is removed faster than the remaining forest can regrow", "Climate change; the new pavement and rooftops raise local temperatures beyond what the native species can tolerate"], "correct": 2, "explanation": "Slides 14 and 43: habitat loss, including deforestation, fragmentation and land conversion, is the leading driver of current biodiversity loss. Fragmentation also isolates the populations left behind, and small isolated populations are vulnerable to genetic drift, inbreeding depression and stochastic events (slides 7, 9).", "t": 11},
  {"q": "A researcher compares bird diversity in a large, continuous tropical forest with the same forest after it has been broken into small, isolated fragments by farmland. Based on island biogeography and conservation genetics, the fragmented forest would most likely show:", "c": ["Higher diversity, because each isolated fragment develops its own distinct community over time", "Lower diversity, because small isolated fragments have higher extinction rates, lower immigration, and less gene flow", "No change in diversity, because the total number of individuals across the fragments stays about the same", "Higher diversity, because breaking up the forest reduces competition among the species that remain", "Lower diversity in tropical fragments but not temperate ones, because temperate species disperse farther"], "correct": 1, "explanation": "Fragments behave like small, isolated islands with higher extinction rates and less immigration (Lecture 8, slides 51–56), and the small populations left in each fragment lose alleles to drift and suffer inbreeding (Lecture 11, slides 7 and 9). Habitat loss and fragmentation is the leading driver of biodiversity loss (slide 43).", "t": 11},
  {"q": "The U.S. Endangered Species Act (ESA) and CITES (the Convention on International Trade in Endangered Species) are examples of which approach to conservation?", "c": ["A species-specific approach that classifies and protects individual threatened species", "A system-level approach that protects whole ecosystems such as the Everglades", "Species triage, which abandons the most expensive recoveries to fund cheaper ones", "Genetic rescue, which moves individuals between populations to add new alleles", "Biomanipulation, which reintroduces top predators to restore food-web structure"], "correct": 0, "explanation": "Slide 16 contrasts the species-specific approach (ESA, CITES, which classify species by how threatened they are) with the newer system-level approach adopted by The Nature Conservancy (Everglades, Afro-montane forest). CITES specifically regulates international trade in threatened species.", "t": 11},
  {"q": "An endangered mammal survives in three reserves separated by farmland, so no individuals move among them. Which landscape-level action most directly reduces the genetic risks created by this isolation?", "c": ["Establish wildlife corridors reconnecting the reserves so individuals and their genes can move among them", "Fence each reserve completely so that the three populations stay genetically distinct from one another", "Reduce the area of each reserve so that managers can concentrate their effort on fewer animals", "Remove predators from all three reserves so that a larger share of each year's juveniles survive", "Census each population every year with mark-recapture so that any decline is detected early"], "correct": 0, "explanation": "Corridors increase landscape connectivity (Lecture 8, Golden Lion Tamarin example), turning isolated populations into a connected metapopulation in which immigration counteracts genetic drift and inbreeding in each small population (Lecture 11, slides 7, 37–42). Fencing, shrinking, predator removal or monitoring do not restore gene flow.", "t": 11},
  {"q": "A lake receives heavy nutrient runoff and is choked with algae. Managers add piscivorous fish and the algae decline, although nutrient inputs are unchanged. What does this show about top-down and bottom-up control in this lake?", "c": ["Both operate: nutrients set the potential algal crop, and predators can still reduce it", "Top-down control operates alone here, since nutrients had no effect on the algae", "Bottom-up control operates alone here, since the predators did not eat the algae", "Neither operates, because algae respond to sunlight rather than to nutrients or predators", "The predators lowered the lake's nutrient concentration, a bottom-up effect"], "correct": 0, "explanation": "Slides 20-22: excess nutrients (bottom-up) are why the lake grows so much algae, yet adding piscivores reduces algae through a four-level cascade (top-down) without changing nutrients. In a trophic cascade alternating levels are predator- and resource-controlled, so both kinds of control shape the same food web.", "t": 7, "src": "07:16-22"},
  {"q": "Which of the following research projects is the clearest example of ecology, as the term was defined in lecture?", "c": ["Describing the anatomy of the tadpole digestive tract under a microscope", "Measuring how water temperature and predatory fish affect tadpole survival in a pond", "Classifying frog species by the shapes of their skull bones", "Sequencing a tadpole genome to catalog every gene that it contains", "Measuring the rate of ATP production in isolated frog muscle cells"], "correct": 1, "explanation": "Ecology is the scientific study of the interactions between organisms and their environment (slide 26). Only the pond study examines how an organism interacts with abiotic (temperature) and biotic (predator) parts of its environment (slide 28); the others are anatomy, taxonomy, genomics and cell physiology.", "t": 1, "src": "01:26-28"},
  {"q": "A manatee living in a Florida spring is affected by all of the factors below. Which one is a BIOTIC factor?", "c": ["The flow rate of water leaving the spring", "The drop in water temperature during a winter cold snap", "The salinity where the spring run meets the estuary", "The seagrass and algae it feeds on", "The concentration of dissolved oxygen in the water"], "correct": 3, "explanation": "Biotic factors are the other organisms in an environment, such as food plants, predators and competitors. Temperature, dissolved oxygen, flow and salinity are physical or chemical (abiotic) factors.", "t": 1, "src": "01:28"},
  {"q": "Two fish species live in the same river. Species A survives water temperatures from 15 to 35 °C; species B survives only 20 to 28 °C. After a cold front drops the river to 17 °C for three days, most of species B dies while species A is unaffected. This outcome best illustrates that:", "c": ["Temperature is a biotic factor because it acts on living things", "Reciprocal selection between the two species caused the die-off", "Abiotic factors act on whole communities, not on individual species", "Species A outcompeted species B for food during the cold front", "Species differ in their tolerance of abiotic factors, which affects their survival"], "correct": 4, "explanation": "Abiotic factors such as temperature affect the ability of individuals to survive and reproduce, and slide 28 stresses that individuals (and species) differ in their 'tolerance' of those factors. Nothing in the scenario involves competition or coevolution, and temperature is a physical (abiotic) factor, not a biotic one.", "t": 1, "src": "01:28"},
  {"q": "A biologist counts every American alligator in Lake Alice on the UF campus and records their births, deaths and growth over five years. This study is at which level of ecological organization?", "c": ["Community", "Organism", "Ecosystem", "Biosphere", "Population"], "correct": 4, "explanation": "A population is a group of individuals of the same species living in the same area; tracking the numbers, births and deaths of one species in one lake is population-level ecology. A community would include the other species, and an ecosystem would add the abiotic environment.", "t": 1, "src": "01:34"},
  {"q": "A research team measures how phosphorus inputs, water temperature and sunlight interact with the algae, snails and fish of a lake to control the lake's dissolved oxygen. This study is at which level of ecological organization?", "c": ["Population", "Ecosystem", "Community", "Biosphere", "Organism"], "correct": 1, "explanation": "An ecosystem is the community of organisms (algae, snails, fish) plus the abiotic environment they interact with (phosphorus, temperature, light, oxygen). Because abiotic factors are an explicit part of the study, it is above the community level.", "t": 1, "src": "01:34"},
  {"q": "Across the Pacific Northwest, rough-skinned newts are extremely toxic in regions where common garter snakes are highly resistant to tetrodotoxin (TTX), but only mildly toxic in regions where garter snakes are absent or non-resistant. Which explanation is MOST consistent with lecture?", "c": ["A mutualism in which toxin production benefits both newts and snakes", "Genetic drift has randomly fixed high toxicity in some newt populations", "Convergent evolution: newts and snakes independently evolved the same toxin", "Newts are toxic mainly to deter birds and mammals, which are simply more abundant in some regions than others", "Reciprocal selection: resistant snakes select for more toxic newts, which select for more resistant snakes"], "correct": 4, "explanation": "Slides 31-32: the extreme toxicity is not for general defense but a specific response to one resistant predator, and reciprocal selection means each species is the selective agent for the other, so toxicity and resistance escalate together only where the two species interact. Birds and mammals are deterred by far less toxin than a newt carries.", "t": 1, "src": "01:31-32"},
  {"q": "According to lecture, the common garter snake (Thamnophis sirtalis) tolerates the tetrodotoxin (TTX) of the rough-skinned newt because it has evolved:", "c": ["A mutation in its sodium channels that makes them resistant to TTX", "A behavior of eating only the non-toxic tail of the newt", "Gut bacteria that break down TTX before it is absorbed", "A thicker stomach lining that blocks absorption of the toxin", "The ability to produce its own TTX so that it is immune to the newt's"], "correct": 0, "explanation": "TTX works by blocking sodium channels in nerves and muscle; garter snakes carry a mutation in their sodium channels that renders them resistant. This resistance is the snake's side of the reciprocal-selection arms race.", "t": 1, "src": "01:32"},
  {"q": "In the hippo-pool study described in lecture, the researchers (i) noticed dead fish after large floods, (ii) proposed that floods flush low-oxygen water from hippo pools downstream, (iii) added hippo-pool water to experimental stream channels, and (iv) examined the resulting oxygen records. In the language of the scientific method, which sequence correctly orders these four steps?", "c": ["Analysis → experiment → observation → hypothesis", "Observation → hypothesis → experiment → analysis", "Experiment → observation → analysis → hypothesis", "Observation → analysis → experiment → hypothesis", "Hypothesis → observation → analysis → experiment"], "correct": 1, "explanation": "The scientific method (LO 4; slides 42-49) moves from observation (fish kills after floods) to a testable hypothesis (floods flush hypoxic hippo-pool water downstream), then to an experiment designed to test it (adding pool water to stream channels), and finally to analysis of the results. The hypothesis must come before the experiment that tests it.", "t": 1, "src": "01:42-49"},
  {"q": "In the hippo-pool study described in lecture, researchers built 12 artificial stream channels (60 L each, with paddle wheels and a dissolved-oxygen logger) instead of relying only on the river measurements. The main reason for using these mesocosms was to:", "c": ["Measure river discharge more accurately than the field sensors could", "Study the fish community at a smaller, more manageable scale", "Count how many fish die after each flood without having to wait for a natural flood", "Control the amount of hippo-pool water added and isolate its effect on dissolved oxygen", "Show that hippos kill fish directly by trampling rather than through their waste"], "correct": 3, "explanation": "Three years of river monitoring showed that high flows were followed by drops in dissolved oxygen (slide 44), but to understand the mechanism the researchers needed a controlled experiment that could separate the effects of hippo-pool water and hippo feces on DO (slide 47 notes). Known amounts of pool water (0.5-10 L) were added to five channels and compared with a control channel (slides 48-49). The channels tracked dissolved oxygen, not fish deaths or river discharge.", "t": 1, "src": "01:44-49"},
  {"q": "In the stream-channel experiment, dissolved oxygen (DO) was logged in a control channel and in channels that received 0.5, 1, 2.5, 5 or 10 L of hippo-pool water. The control showed only a regular day-night (diel) rise and fall. The 10 L channel dropped from about 7 mg/L to about 4 mg/L within hours of the addition and returned to control levels within two days; each smaller addition produced a smaller drop. Which conclusion do these data BEST support?", "c": ["Hippo-pool water causes a dose-dependent but temporary decline in dissolved oxygen", "Hippo-pool water permanently removes oxygen from stream water", "The amount of hippo-pool water added had no effect on the size of the oxygen drop", "The control channel must have been contaminated, because its oxygen also changed over the day", "The oxygen decline in the treated channels was simply the normal day-night cycle"], "correct": 0, "explanation": "Larger additions produced larger oxygen declines (a dose response: the effect scales with the amount added), and every channel recovered within about two days, matching the rapid-decline-and-rebound pattern seen in the river (slide 49 notes). The control's diel cycle is normal and is the baseline the treated channels are compared against.", "t": 1, "src": "01:49"},
  {"q": "Three years of continuous monitoring on the Mara River recorded 49 high-flow (flood) events. Dissolved oxygen fell after every one of them, 13 events reached hypoxia (below 2 mg/L), and over five years nine fish kills all coincided with flushing flows. Which statement is BEST supported by these field data?", "c": ["Dissolved oxygen rises whenever discharge rises, because floodwater is well mixed with air", "Fish kills occur mainly during dry, low-flow periods, when the stagnant river holds little oxygen", "Floods are consistently followed by drops in dissolved oxygen, supporting the hippo-pool flushing hypothesis", "Dissolved oxygen in the river varies independently of discharge", "The data prove that hippos kill fish directly by trampling them"], "correct": 2, "explanation": "Every discharge spike was followed by an oxygen drop, and the fish kills lined up with those flushing flows (slide 44 and notes), which supports but does not by itself prove the hippo-pool hypothesis; the mesocosm experiment was then used to test the mechanism. Hypoxia was defined in lecture as dissolved oxygen below 2 mg/L.", "t": 1, "src": "01:44"},
  {"q": "Which of the following was given in lecture as an example of why ecology matters for human well-being?", "c": ["Most human genetic diseases were first identified during ecological field studies of wild populations", "About 70% of new drugs in the last 25 years, including taxol and digitalis, came from nature", "Ecological models are the main tool used to design new surgical techniques", "Studying food webs allows physicians to determine a patient's blood type", "Ecologists were the first to work out how mitochondria generate ATP"], "correct": 1, "explanation": "Slide 51 notes: ecology is everywhere, and about 70% of new drugs in the last 25 years come from nature, including the anti-cancer drug taxol and heart drugs such as digitalis. The LO also lists clean water, pollination and understanding climate change as reasons ecology matters for human well-being.", "t": 1, "src": "01:50-51"},
  {"q": "Why does one square meter of ground near the equator receive more solar energy than one square meter near the poles?", "c": ["The equator is much closer to the Sun than the poles are", "Sunlight hits the equator at a steep angle, so it crosses less atmosphere and is spread over less ground", "The atmosphere is thicker over the equator, so it traps more of the Sun's heat near the ground", "The poles are tilted away from the Sun for the entire year", "Ocean water at the equator reflects extra sunlight back onto the land"], "correct": 1, "explanation": "At high latitudes the Sun's rays arrive at an oblique angle, so the same beam of energy is spread over a larger area and must pass through more atmosphere (where more is scattered and absorbed). At the equator the angle is steep, giving more energy per square meter.", "t": 2, "src": "02:09"},
  {"q": "On the June solstice (about June 21), the Sun is directly overhead at noon at which latitude, and which hemisphere is experiencing its longest days?", "c": ["The equator; both hemispheres have equal day and night", "The Tropic of Cancer (23.5° N); the Northern Hemisphere", "The North Pole; the Northern Hemisphere", "The Tropic of Capricorn (23.5° S); the Southern Hemisphere", "The Tropic of Cancer (23.5° N); the Southern Hemisphere"], "correct": 1, "explanation": "Because Earth's axis is tilted 23.5°, the latitude of most direct sunlight shifts between the Tropic of Cancer (June solstice, Northern Hemisphere summer) and the Tropic of Capricorn (December solstice). The Sun is over the equator only at the March and September equinoxes.", "t": 2, "src": "02:08"},
  {"q": "Suppose Earth's axial tilt increased from 23.5° to 35°. Based on the lecture explanation of seasons, which outcome would you predict?", "c": ["The hemispheres would swap seasons, with June becoming winter in the Northern Hemisphere", "Seasons would disappear, because tilt and seasonal variation are inversely related", "Nothing would change, because seasons are caused by Earth's distance from the Sun", "The equator would become colder than the poles for part of the year", "Summers and winters would become more extreme in both hemispheres"], "correct": 4, "explanation": "Seasons exist because the tilt changes how directly each hemisphere faces the Sun through the year (slide 8 notes); the iClicker on slide 25 makes the reverse point, that removing the tilt eliminates seasonal variation. A larger tilt increases the difference between the summer and winter hemispheres, so seasonal contrast grows. Distance from the Sun is not the cause of seasons.", "t": 2, "src": "02:08, 02:25"},
  {"q": "Intense solar heating at the equator causes air to rise. Which sequence correctly describes what happens to that air and the water vapor it carries?", "c": ["The rising air cools and absorbs more water vapor, so it stays dry until it reaches 30° latitude", "The rising air expands and cools; cooler air holds less water vapor, so the vapor condenses and falls as rain", "The rising air gains moisture from the upper atmosphere and releases it as rain at 30° latitude", "The rising air is compressed and warms, so more water evaporates and the air becomes drier", "The rising air immediately sinks back down because it is denser than the air around it"], "correct": 1, "explanation": "Heated air becomes less dense and rises; as it rises it expands and cools adiabatically, and because cold air holds less water vapor, the vapor condenses into clouds and rain. This is why the equatorial zone is so wet and supports rainforests.", "t": 2, "src": "02:10-14"},
  {"q": "A weather station at 28° N in northern Africa records about 20 mm of rain per year, while a station at 2° N in the Congo basin records about 1,800 mm per year. Which explanation BEST accounts for the difference?", "c": ["At 28° N air is sinking in the dry, descending limb of the Hadley cell; at 2° N air is rising and raining out", "The Inter-Tropical Convergence Zone sits permanently over 28° N", "Sunlight is more intense at 28° N than at 2° N, so rain there evaporates before it reaches the ground", "The Coriolis effect is much stronger at 28° N and spins rain clouds away", "The trade winds carry the Congo basin's moisture toward the equator and away from 28° N"], "correct": 0, "explanation": "Air that rose and rained out at the equator moves poleward aloft, cools, becomes dense and sinks near 30° latitude; the sinking air is dry and absorbs moisture from the land, producing the belt of subtropical deserts (slides 15-17 and notes). The equatorial station sits under the rising, rain-producing air of the ITCZ (slides 13-14).", "t": 2, "src": "02:15-17"},
  {"q": "Sailing ships crossing the equator could be stranded for days or weeks with no wind in the 'doldrums.' According to the explanation given in lecture, why are the doldrums calm?", "c": ["The westerlies and the polar easterlies blow in opposite directions and cancel at the equator", "Ocean gyres stop at the equator, so the air above them stops moving as well", "The doldrums lie at 30° latitude, where descending air creates high pressure and the air barely moves", "At the equator the Coriolis effect is strongest and cancels all surface winds", "The doldrums are the ITCZ, where the trade winds converge and heated air rises instead of blowing across the surface"], "correct": 4, "explanation": "The ITCZ, or doldrums, is the low-pressure belt near the equator where the northeast and southeast trade winds converge and intense heating sends air upward (slide 13 and notes, slide 23 notes); with the air rising instead of moving horizontally, surface winds are weak. Its position shifts seasonally.", "t": 2, "src": "02:13, 02:23"},
  {"q": "A ball is rolled from the North Pole directly toward the equator. To an observer on the ground, its path appears to curve to the right. According to lecture, this apparent curve occurs because:", "c": ["Earth rotates eastward and lower latitudes move faster, so the ground shifts beneath the ball before it arrives", "Earth's 23.5° tilt makes everything that moves southward lean to the right", "Gravity is stronger near the equator and pulls the ball sideways as it travels", "The westerlies push the ball to the right as it crosses the middle latitudes", "Earth's magnetic field deflects anything moving across it toward the east in the Northern Hemisphere"], "correct": 0, "explanation": "This is the Coriolis effect: a point on the equator travels eastward much faster than a point near the pole, so an object moving toward the equator lags behind the ground and appears deflected to the right in the Northern Hemisphere (left in the Southern). The same effect shapes winds and ocean currents.", "t": 2, "src": "02:20-21"},
  {"q": "In the Southern Hemisphere, surface air flows from about 30° S toward the equator as part of the Hadley cell. Taking the Coriolis effect into account, the Southern Hemisphere trade winds blow FROM the:", "c": ["Southwest", "Southeast", "Due west", "Northeast", "Due south"], "correct": 1, "explanation": "Air moving northward toward the equator in the Southern Hemisphere is deflected to the left, which is toward the west, so the wind arrives from the southeast. In the Northern Hemisphere the mirror-image deflection (to the right) produces northeast trade winds; both sets blow from east to west.", "t": 2, "src": "02:19-22"},
  {"q": "Storm systems over most of the continental United States (roughly 30-50° N) generally travel from west to east. Which belt of prevailing winds is responsible?", "c": ["The polar easterlies, which blow from east to west near the poles", "Monsoon winds, which reverse direction every six months", "The trade winds, which blow from east to west in the tropics", "The westerlies, which blow from west to east through the middle latitudes", "The doldrums, where surface winds are calm and storms do not move"], "correct": 3, "explanation": "Between about 30° and 60° latitude the prevailing winds are the westerlies, and the turbulent storms that form where warm and cold air masses meet sweep from west to east through the middle latitudes. Trade winds and polar easterlies blow the opposite way.", "t": 2, "src": "02:18, 02:26"},
  {"q": "A buoy released in the subtropical North Atlantic drifts in a large closed loop: westward near the tropics, north along the U.S. East Coast, east across the ocean, then south again. According to lecture, this surface gyre is produced by:", "c": ["Prevailing winds dragging the surface water, with the Coriolis effect bending the flow right into a clockwise loop", "The gravitational pull of the Moon on the ocean surface, which drags the water around the whole basin", "Earth's axial tilt, which pushes surface water toward the poles each summer", "The Coriolis effect bending the flow to the left, closing a counterclockwise loop", "Differences in water density caused by temperature and salinity (thermohaline circulation)"], "correct": 0, "explanation": "Surface currents are driven by the prevailing winds and deflected by the Coriolis effect, which produces clockwise subtropical gyres in the Northern Hemisphere and counterclockwise gyres in the Southern Hemisphere. Density-driven thermohaline circulation drives deep currents, not the wind-driven surface gyres.", "t": 2, "src": "02:26"},
  {"q": "Gainesville, Florida (29.6° N) lies near the same latitude as the world's great 30° N desert belt, yet it has a warm, humid climate. Lecture attributed Florida's warm, wet climate mainly to:", "c": ["The Inter-Tropical Convergence Zone, which sits over Florida for most of the year", "Descending air from the polar cell, which warms as it sinks over the Florida peninsula", "The Gulf Stream, a warm current that keeps the coast warm and supplies moisture", "A rain shadow on the eastern side of the Appalachian Mountains", "Florida's elevation, which lifts the land into moist air"], "correct": 2, "explanation": "Lecture 02 slide 29: the ocean modifies regional climate by moderating temperature and rainfall, and the warm Gulf Stream current off coastal Florida keeps the state warm and wet. Descending Hadley-cell air makes deserts around 30° N and S (slide 16), so Florida's climate is a regional modification of the global pattern (slide 48). The ITCZ sits near the equator, not over Florida, and polar-cell air does not reach 30° N.", "t": 2, "src": "02:16,29"},
  {"q": "On a hot summer afternoon at a Florida beach, the wind blows steadily from the ocean onto the land (a sea breeze). Which explanation matches the lecture's account of how landmasses modify climate?", "c": ["The beach lies on the leeward side of a coastal mountain range", "Descending Hadley-cell air at 30° N is funneled onto the beach each afternoon", "Water heats faster than land, so air over the ocean rises and draws air from the land out to sea", "The Coriolis effect turns all winds toward the nearest coastline in the afternoon", "Land heats faster than water, so warm air over the land rises and cooler sea air flows in to replace it"], "correct": 4, "explanation": "Slide 27 lists landmasses as a modifier of regional climate because land heats faster than oceans (the notes: land has a lower heat capacity), and names the land-sea breeze and monsoons as the results. Daytime heating over land makes the air there rise, and cooler marine air flows in to replace it; the same contrast on a seasonal scale drives monsoons.", "t": 2, "src": "02:27"},
  {"q": "The Cascade Range in Washington State runs north-south, and the prevailing winds there blow from the Pacific Ocean (from the west). Which statement correctly identifies the dry side of the range and the reason?", "c": ["The western side is dry (leeward), because the ocean air arrives already dry", "The eastern side is dry (leeward), because air that rained out on the western slope descends dry", "Both sides receive equal rain, because mountains do not affect precipitation", "The western side is dry, because the Coriolis effect deflects the rain to the east", "The summit is the driest part, because it sits above the clouds"], "correct": 1, "explanation": "Air forced up the windward (western, ocean-facing) slope cools and drops its moisture as rain; by the time it crosses the crest and descends the leeward (eastern) slope it is dry, creating a rain shadow. Which side is windward depends entirely on the prevailing wind direction.", "t": 2, "src": "02:28"},
  {"q": "A steep, north-facing ravine in Gainesville stays several degrees cooler and much moister than the surrounding flat landscape, and it supports ferns that grow nowhere else nearby. The ravine is best described as a:", "c": ["Inter-Tropical Convergence Zone", "Microclimate", "Weather event", "Biome", "Rain shadow"], "correct": 1, "explanation": "A microclimate is a local zone where the climate differs from that of the surrounding area; shaded, sheltered ravines are classic examples. It is a persistent local condition, not short-term weather and not a large regional pattern.", "t": 2, "src": "02:30"},
  {"q": "Which of the following statements describes CLIMATE rather than weather?", "c": ["Last Tuesday was the windiest day of the month in Gainesville", "A thunderstorm dropped 5 cm of rain on campus at 4 p.m. yesterday", "A cold front will move through North Florida this coming weekend", "Tomorrow's forecast high in Gainesville is 31 °C (88 °F)", "Gainesville's average January low over the past 30 years is about 7 °C (45 °F)"], "correct": 4, "explanation": "Climate describes how the atmosphere behaves over a long period, so a 30-year average is climate. Weather is the day-to-day state of the atmosphere and its short-term variation over minutes to weeks, which covers forecasts, individual storms and fronts.", "t": 2, "src": "02:32-34"},
  {"q": "According to the definition given in lecture, a gas is a 'greenhouse gas' because it:", "c": ["Is produced only by human activities such as burning fossil fuels", "Absorbs and emits infrared (heat) radiation but not radiation in or near the visible spectrum", "Destroys ozone in the upper atmosphere", "Absorbs visible light so strongly that the surface receives less sunlight", "Reflects incoming visible sunlight back to space before it reaches the ground"], "correct": 1, "explanation": "Visible sunlight passes through the atmosphere and warms the surface, which re-radiates energy as infrared. Greenhouse gases absorb that infrared and emit it back, trapping heat near the surface; this is the greenhouse effect, and many greenhouse gases (like water vapor) also occur naturally.", "t": 2, "src": "02:39"},
  {"q": "Which of the following is NOT a greenhouse gas?", "c": ["Methane (CH4)", "Nitrous oxide (N2O)", "Chlorofluorocarbons (CFCs)", "Water vapor (H2O)", "Nitrogen gas (N2)"], "correct": 4, "explanation": "Lecture listed water vapor, CO2, methane, nitrous oxide, ozone and CFCs as greenhouse gases because they absorb and emit infrared radiation. N2 makes up most of the atmosphere but does not absorb infrared, so it is not a greenhouse gas (do not confuse it with nitrous oxide, N2O).", "t": 2, "src": "02:39"},
  {"q": "Atmospheric CO2 measured at Mauna Loa rose from about 315 ppm in 1958 to about 425 ppm in 2024, methane and nitrous oxide concentrations have also climbed, and global average surface temperature has risen over the same period, with nearly all of the hottest years on record occurring since 2000. Which conclusion is BEST supported by these data and consistent with lecture?", "c": ["Rising greenhouse gas concentrations from human activity are correlated with, and explain, the rise in global temperature", "The data show only a correlation, so lecture concluded that the cause of the warming is unknown", "Temperature rose first and drove CO2 out of the oceans, so the gases are a result of warming rather than its cause", "The hottest years on record cluster before 1950, so recent warming is not unusual", "CO2 has risen, but global temperature has shown no change since 1958"], "correct": 0, "explanation": "Slides 38-40 answer 'why is our climate getting warmer?' with 'greenhouse gases on the rise': because these gases absorb and emit infrared radiation, their increase traps heat and warms the planet, and the temperature record tracks the gas record (slide 37 notes: 14 of 15 of the hottest recorded years have occurred since 2000). Lecture presented the gases as the cause of the warming, not a consequence of it.", "t": 2, "src": "02:37-40"},
  {"q": "Rising atmospheric CO2 is harming corals, oysters and other shell-building marine organisms. Which chain of events given in lecture explains this?", "c": ["CO2 warms the water so much that the shells dissolve", "CO2 raises the pH of seawater, making it too basic for shell formation", "CO2 dissolves to form carbonic acid, and the H+ released ties up the carbonate ions needed to build shells", "CO2 increases the salinity of seawater, which dehydrates the organisms", "CO2 blocks sunlight from reaching the ocean, so shell-building organisms cannot photosynthesize"], "correct": 2, "explanation": "CO2 reacts with water to form carbonic acid (H2CO3), which dissociates into H+ and bicarbonate; the extra H+ ties up carbonate ions, leaving less carbonate for calcification. This ocean acidification lowers pH (more acidic, not more basic) and is a separate impact from the coral bleaching caused by warm water.", "t": 2, "src": "02:43"},
  {"q": "According to lecture, which set of factors determines the type of biome that develops in a region?", "c": ["Latitude and altitude, which together fix the length of the growing season", "Climate (temperature, precipitation, seasonality), soils or substrate, and the disturbance regime", "The number of animal species present and the diversity of the plants growing there", "Ocean salinity, tidal range and the strength of the currents along the nearest coast", "The geological age of the continent and the kind of bedrock lying beneath the soil"], "correct": 1, "explanation": "Lecture 03 (slides 6-7, 11) lists three kinds of drivers: climate and its variability (temperature, precipitation, seasonality), the physical environment (soils/substrate) and disturbance (fire, grazing, human activity). Temperature and precipitation are the most important of these, but latitude by itself is only a rough proxy for them.", "t": 3, "src": "03:06-07,11-12"},
  {"q": "Two regions have nearly identical annual temperature and precipitation. Region 1 burns every few years and is grazed by large herbivores; it is a grassland. Region 2 has no fires or grazers; it is a forest. Which factor best explains why the two regions support different biomes?", "c": ["The disturbance regime (fire and grazing) keeps Region 1 open and dominated by grasses", "Region 1 must lie closer to the equator", "Convergent evolution has made the grasses in Region 1 resemble trees", "The Coriolis effect deflects rainfall away from Region 1", "Region 2 receives more sunlight because forests absorb more light"], "correct": 0, "explanation": "Climate alone cannot explain the difference because temperature and precipitation are the same. Lecture 03 (slides 6-7) names disturbance as a biome driver, and both temperate grasslands and tropical savannas are maintained by disturbance such as fire and grazing (slides 44-45, 51); without it they may become forest.", "t": 3, "src": "03:06-07,44-45,51"},
  {"q": "You are handed a Walter climate diagram whose x-axis begins in July rather than January. According to lecture, what does this tell you about the site?", "c": ["It is in the Northern Hemisphere, because July is the wettest month there", "It is on the equator, where there is no winter to start the axis from", "It is in the Southern Hemisphere, because Southern Hemisphere diagrams start in July", "It is in the Northern Hemisphere, because July is midsummer there", "Nothing; the month the x-axis starts on is chosen arbitrarily"], "correct": 2, "explanation": "Lecture 03 (slides 13-16): Northern Hemisphere diagrams start the x-axis in January and Southern Hemisphere diagrams start in July. As a check, a Southern Hemisphere site will show its lowest temperatures in June-July (winter) rather than a peak.", "t": 3, "src": "03:13-16"},
  {"q": "A Walter climate diagram for a Northern Hemisphere site shows the precipitation curve above the temperature curve from October through May, but from June through August the temperature curve rises above the precipitation curve. What does this tell you about the site?", "c": ["It has a wet summer and a dry winter", "It is water-limited in every month of the year", "Precipitation exceeds temperature only in summer", "It experiences a summer water deficit (drought) and a moist winter", "It must be in the Southern Hemisphere"], "correct": 3, "explanation": "On a Walter diagram, months in which the temperature line lies above the precipitation line are periods of water stress (drought); months where precipitation lies above temperature are moist. Here the deficit falls in June-August, so the site has dry summers and wet winters (Lecture 03 slides 13-16; LO 2).", "t": 3, "src": "03:13-16"},
  {"q": "A Walter climate diagram shows the temperature curve above the precipitation curve in every month of the year; monthly mean temperatures range from 12 °C to 34 °C. Which biome is this site most likely to be?", "c": ["Tropical rain forest", "Boreal forest", "Tundra", "Temperate forest", "Desert"], "correct": 4, "explanation": "Temperature above precipitation on a Walter diagram means water deficit, so a site in deficit all year is permanently water-limited: a desert (Lecture 03 slides 13-16, 24-25; LO self-assessment 1). Rain forests have precipitation far above temperature year-round; tundra and boreal forest would show months well below 0 °C.", "t": 3, "src": "03:13-16,24-25"},
  {"q": "On a Walter climate diagram, the monthly mean temperature is below 0 °C from October through April and above 0 °C only from May through September. What is the approximate length of the growing season at this site?", "c": ["About 5 months (May through September)", "About 7 months (October through April)", "All 12 months, because precipitation is what limits growth", "Zero months; no plants can grow at this site", "It cannot be determined without the precipitation curve"], "correct": 0, "explanation": "The growing season on a Walter diagram is the set of months with mean temperature above 0 °C (Lecture 03 LO 2). Here that is May-September, about five months, typical of tundra or boreal forest sites with severe winters (slides 30-36).", "t": 3, "src": "03:13-16,30-36"},
  {"q": "One site lies directly beneath the Inter-Tropical Convergence Zone at the equator; another lies beneath the descending limb of a Hadley cell at about 30° N. Based on the link lecture drew between global circulation and biomes, which biome do you expect at the equatorial site and at the 30° N site, respectively?", "c": ["Tropical rain forest; desert", "Desert; tropical rain forest", "Tropical savanna; temperate forest", "Boreal forest; tundra", "Tropical rain forest; boreal forest"], "correct": 0, "explanation": "Lecture 03 (slides 8-9, 24) ties biomes to the circulation patterns of Lecture 02: air rising at the ITCZ cools and rains out, giving the equatorial rain forest belt, while the dry air descending near 30° gives the subtropical desert belt (slide 24 marks deserts at 30° N and 30° S).", "t": 3, "src": "03:08-09,24"},
  {"q": "In addition to the equatorial rain forests, there is a broad belt of forest (the boreal forest) near 60° N. According to lecture, why is there enough precipitation for forest at that latitude?", "c": ["Air descends at 60° N and releases its moisture as it warms", "Warm air moving poleward from 30° rides up over cold polar air near 60° N, and the rising air produces rain and snow", "The Coriolis effect concentrates rainfall in a narrow band at 60° N", "Melting permafrost supplies most of the water that the trees need, so very little rain is required at 60° N", "Conifers draw most of their water from snow through their needles"], "correct": 1, "explanation": "Lecture 03 slide 9 notes: at about 60° N the warmer air moving from 30° overtops polar air moving down from 90°, so air rises, cools and produces precipitation, supporting the large boreal forest belt. Descending air produces dry conditions, as it does at 30°.", "t": 3, "src": "03:08-09,33-35"},
  {"q": "A region has warm temperatures that vary little across the year, a pronounced wet season and dry season, trees scattered among abundant grasses, and periodic fires that keep the trees from closing into forest. Which biome is this?", "c": ["Temperate grassland/shrubland", "Tropical rain forest", "Temperate forest", "Tropical savanna / seasonal forest", "Boreal forest"], "correct": 3, "explanation": "Lecture 03 (slides 49-51): tropical savanna has little temperature variation but distinct wet and dry seasons, tree/grass codominance, and often requires disturbance (fire) to be maintained. Temperate grasslands differ in having hot summers and cold winters (slide 44).", "t": 3, "src": "03:48-51"},
  {"q": "Tundra and boreal forest both experience severe winters. Which statement correctly contrasts the two biomes as described in lecture?", "c": ["Tundra is dominated by broad-leaved deciduous trees, whereas boreal forest has no trees at all because of permafrost", "Boreal forest has a longer growing season than the tropical rain forest", "Boreal forest is dominated by conifers; tundra has almost no trees and is covered by lichens, mosses and cushion plants", "Tundra has fertile, well-drained soils, whereas boreal forest soils are frozen year-round", "Boreal forest lies at the equator and tundra at 30° N and S"], "correct": 2, "explanation": "Lecture 03 slides 31 and 36: tundra plants stay low to the ground (cushion plants, lichens, moss) and there are almost no trees because of permafrost and little rainfall, while the boreal forest (taiga) is dominated by spruces, firs and pines whose cone shape sheds snow.", "t": 3, "src": "03:29-36"},
  {"q": "Lecture pointed out that the dominant mammals of deserts are small burrowers (gerbils, kangaroo rats) rather than large grazers. What explanation was given?", "c": ["Large mammals cannot digest the tough tissue of cactus and other desert plants", "There is no shade and little water, so small animals that can retreat underground are favored", "Predators are so abundant in deserts that large mammals are quickly eaten", "Desert nights are too cold for large-bodied mammals to survive", "Large mammals are kept out by the thorns on desert plants"], "correct": 1, "explanation": "Lecture 03 slide 27 notes: 'Why no big mammals? There's no shade, and they need water! Dominant mammals are typically burrowers.' Burrowing animals escape heat and water loss; kangaroo rats can even survive indefinitely without free water (slide 28).", "t": 3, "src": "03:24-28"},
  {"q": "Why are boreal forest soils poor, according to lecture?", "c": ["Frequent fires remove nutrients faster than they can be replaced", "Spring snowmelt leaches most of the nutrients out of the soil before the growing season begins each year", "The soils are mostly sand and gravel left behind by glaciers", "Cold slows decomposition and conifer needles break down slowly, so nutrients return to the soil slowly", "Conifers take up nutrients faster than decomposers can release them"], "correct": 3, "explanation": "Lecture 03 slide 36 notes: soils are poor (and acidic) because cold temperatures inhibit decomposition and pine needles decompose slowly. The same poor soils and short growing season are why the trees are evergreen: it is too expensive to drop leaves and rebuild them every year.", "t": 3, "src": "03:33-36"},
  {"q": "The lecture summarized biomes by combining rainfall and temperature. Which pairing of climate and biome matches that summary?", "c": ["Warm and wet: desert; cold and dry: tropical rain forest", "Warm and wet: tropical rain forest; cold and dry: tundra", "Warm and dry: tundra; cold and wet: desert", "Warm and wet: boreal forest; warm and dry: tundra", "Cold and dry: tropical savanna; warm and wet: tundra"], "correct": 1, "explanation": "Lecture 03 slide 55: the combination of rainfall and temperature (roughly, latitude) predicts the biome. Warm and wet gives tropical rain forest (slides 20-22), warm and dry gives desert (slides 24-25), and cold and dry gives tundra (slide 31: little rainfall, severe winters). Boreal forest is also cold but has lots of precipitation falling as snow (slide 35), so it does not fit 'cold and dry'.", "t": 3, "src": "03:19,55"},
  {"q": "Which of the following is a population, as the term was defined in lecture?", "c": ["All the fish of every species living in Lake Alice", "All the largemouth bass living and breeding in Lake Alice", "The largemouth bass in Lake Alice plus the water, light and nutrients they depend on", "All the largemouth bass across the entire United States", "A school of bass and the minnows they are chasing across the lake"], "correct": 1, "explanation": "Lecture 04 slide 6: a population is a group of interbreeding individuals of a single species living in the same general area, which the bass of one lake fit. All species in the lake make up a community, and the community plus its abiotic environment is an ecosystem (slide 3; Lecture 01 LO 3). Bass spread across a continent are not interbreeding in the same general area, and bass plus minnows involve two species.", "t": 4, "src": "04:06"},
  {"q": "A researcher reports that a forest has 12 oak trees per hectare and that the oaks are concentrated in groups along streams. Which two population attributes have been described?", "c": ["Density (12 per hectare) and dispersion (clumped)", "Dispersion (12 per hectare) and density (clumped)", "Survivorship (12 per hectare) and fecundity (clumped)", "Density (12 per hectare) and migration (clumped)", "Demography (12 per hectare) and allocation (clumped)"], "correct": 0, "explanation": "Lecture 04 slides 7-8: density is the number of individuals per unit area or volume; dispersion is the pattern of spacing among individuals within the population. Groups along streams is a clumped dispersion driven by patchy resources (slide 26).", "t": 4, "src": "04:07-08,24-26"},
  {"q": "You want to estimate the size of a population of dolphins that range widely along a coastline. Which density-estimation approach from lecture is best suited to animals that move around like this?", "c": ["Counting every individual in a small quadrat and multiplying up to the whole coastline", "Counting footprints and scat left along the beach at low tide", "Mark-recapture: capture and mark a sample, release it, and recapture later", "Measuring the dispersion pattern of the dolphins along the coast", "Counting the number of births per individual over a season"], "correct": 2, "explanation": "Lecture 04 slides 11-15: counting individuals in a smaller area works for sedentary or colonial species such as nesting gannets, but 'if what you are trying to count is not sedentary, it is much more difficult', which is why mark-recapture (capture, mark, recapture, do the math) is the classic method for mobile animals.", "t": 4, "src": "04:09-15"},
  {"q": "A wildlife biologist estimates the number of bears in a park by collecting scat and using genetic analysis to identify how many distinct individuals produced it. Which density-estimation approach from lecture is this?", "c": ["Mark-recapture", "Counting signs of individuals", "Measuring dispersion", "A survivorship analysis", "A quadrat count of individuals"], "correct": 1, "explanation": "Lecture 04 slide 13 notes: besides counting animals directly, you can count signs of individuals such as tracks or scat, and genetic analysis of feces can even identify unique individuals. No animals were captured or marked, so it is not mark-recapture.", "t": 4, "src": "04:13"},
  {"q": "Creosote bushes in the Mojave Desert are spaced at remarkably even distances from one another because their roots release chemicals that inhibit the growth of nearby seedlings. Which dispersion pattern and cause does this illustrate?", "c": ["Clumped dispersion caused by patchy resources", "Random dispersion caused by wind-dispersed seeds", "Clumped dispersion caused by social behavior", "Uniform (over-dispersed) dispersion caused by allelopathy", "Random dispersion caused by territoriality"], "correct": 3, "explanation": "Lecture 04 slide 26: uniform dispersion, also called over-dispersed, results from allelopathy (plants secreting toxins that kill surrounding plants), competition, or territoriality. Even spacing is the signature of individuals repelling one another.", "t": 4, "src": "04:24-27"},
  {"q": "Elephants in a dry-season landscape gather in groups around the few remaining waterholes. According to lecture, this is which dispersion pattern, and how common is it in nature?", "c": ["Uniform; the most common pattern in nature", "Random; the most common pattern in nature", "Clumped; the most common pattern in nature", "Clumped; very rare in nature", "Uniform; very rare in nature"], "correct": 2, "explanation": "Lecture 04 slides 26-27 notes: clumped dispersion arises from social behavior or patchy resource distribution and is the most common pattern in nature, because individuals seek the same resources and habitats. Random dispersion is the uncommon one.", "t": 4, "src": "04:24-27"},
  {"q": "Dandelion seeds blown by the wind settle across a flat, homogeneous field. Which dispersion pattern is expected, and why did lecture call this pattern uncommon in nature?", "c": ["Random; uncommon because individuals are usually attracted to or repelled by resources or each other", "Uniform; uncommon because the wind rarely blows steadily enough from one direction to space seeds evenly", "Clumped; uncommon because wind-blown seeds rarely germinate where they land", "Random; uncommon because most wind-dispersed plants reproduce only once", "Uniform; uncommon because allelopathy is rare among wind-dispersed plants"], "correct": 0, "explanation": "Lecture 04 slides 26-27 notes: random dispersion (e.g., wind-dispersed plants) means each individual's position is independent of the others, which is unusual because individuals are usually attracted or repelled by resources, habitat features or other individuals.", "t": 4, "src": "04:24-27"},
  {"q": "On Day 1 you capture and mark 40 salamanders and release them. On Day 2 you capture 50 salamanders, 8 of which carry your mark. Using the Lincoln-Petersen method, what is the estimated population size?", "c": ["16", "90", "250", "400", "2,000"], "correct": 2, "explanation": "N = (M × C) / R = (40 marked × 50 captured on Day 2) / 8 recaptured = 2,000 / 8 = 250 salamanders (Lecture 04 slides 19-21). The logic: 8/50 = 16% of the second sample was marked, so the 40 marked animals should be about 16% of the whole population, and 40 / 0.16 = 250.", "t": 4, "src": "04:15-21"},
  {"q": "A biologist marks 25 fish in a pond. A week later she nets 60 fish and finds that 15 of them are marked. What is the population estimate, and what fraction of the whole population does her estimate assume is marked?", "c": ["N = 100; one quarter of the population is marked", "N = 60; all of the population was captured", "N = 400; one quarter of the population is marked", "N = 100; 60 percent of the population is marked", "N = 25; the marked fish are the whole population"], "correct": 0, "explanation": "N = (M × C) / R = (25 × 60) / 15 = 1,500 / 15 = 100 fish. The method assumes the fraction marked in the second sample (15/60 = 0.25) equals the fraction marked in the whole population (25/N), and 25/0.25 = 100 (Lecture 04 slides 19-21 notes: M2/NS2 = M1/N_est).", "t": 4, "src": "04:18-21"},
  {"q": "The Lincoln-Petersen mark-recapture estimate works because of which key assumption?", "c": ["Every individual in the population is captured at least once", "Marked individuals are more likely to be recaptured than unmarked ones", "The fraction marked in the second sample equals the fraction marked in the whole population", "The population roughly doubles between the first and second capture", "Marks wear off before the second capture so that animals are not counted twice"], "correct": 2, "explanation": "Lecture 04 slides 20-21 notes: the formula comes from setting the proportion marked in the second sample equal to the proportion marked in the entire population (M2/NS2 = M1/N_est) and rearranging. Marks therefore must last until the recapture (slide 16 notes); it is not necessary to capture every individual.", "t": 4, "src": "04:16,19-21"},
  {"q": "Two ponds are surveyed with identical effort: in each, 20 frogs are marked on Day 1 and 40 frogs are captured on Day 2. In Pond A, 4 of the Day-2 frogs are marked; in Pond B, 16 are marked. Which pond has the larger estimated frog population?", "c": ["Pond B, because more recaptures mean more frogs", "Pond A, with an estimate of 200 frogs versus 50 in Pond B", "Pond B, with an estimate of 200 frogs versus 50 in Pond A", "They are equal, because the same number were marked and captured", "Pond A, with an estimate of 800 frogs versus 320 in Pond B"], "correct": 1, "explanation": "Pond A: N = (20 × 40) / 4 = 800 / 4 = 200. Pond B: N = (20 × 40) / 16 = 800 / 16 = 50. Fewer recaptures mean the marked animals were diluted in a larger population, so the estimate goes up (Lecture 04 slides 19-21).", "t": 4, "src": "04:18-21"},
  {"q": "Which of the following is one of the life-history traits that lecture said make up an organism's 'schedule of reproduction'?", "c": ["Its dispersion pattern", "Its body coloration", "Its age at first reproduction", "The density of its population", "The biome it lives in"], "correct": 2, "explanation": "Lecture 04 slides 32 and 39-40: life-history traits are age at first reproduction, frequency and duration of reproduction, total number of offspring (fecundity), and life expectancy (survivorship). Dispersion and density describe the population's spatial pattern, not an individual's reproductive schedule.", "t": 4, "src": "04:32,39-40"},
  {"q": "According to the principle of allocation discussed in lecture, when an organism is under severe environmental stress (for example, starvation), which life function receives first priority for its limited energy?", "c": ["Reproduction, so that genes are passed on before death", "Growth, so that the organism becomes large enough to escape predators", "Defense against predators", "Maintenance of the integrity of its own body", "All functions receive exactly equal shares regardless of conditions"], "correct": 3, "explanation": "Lecture 04 slides 33-35 notes: acquired resources are divided among reproduction, growth, defense and maintenance; in abundant conditions all can expand, but 'in stressful situations the first priority is to maintain the integrity of its body', so most energy goes to maintenance.", "t": 4, "src": "04:33-35"},
  {"q": "The century plant (Agave) grows for decades, then produces a single enormous flower stalk and dies. An oak tree produces acorns every autumn for hundreds of years. Which terms from lecture describe these two reproductive strategies?", "c": ["Agave is iteroparous; oak is semelparous", "Agave is semelparous; oak is iteroparous", "Both are semelparous because both are plants", "Agave is anadromous; oak is iteroparous", "Both are iteroparous because both live many years"], "correct": 1, "explanation": "Lecture 04 slide 36: semelparous ('big bang') species expend their energy in a single, immense reproductive effort (annual plants, Pacific salmon, many insects); iteroparous species reproduce repeatedly (most shrubs and trees, most vertebrates). Living a long time before reproducing does not make the agave iteroparous; what matters is the single reproductive event.", "t": 4, "src": "04:36,43"},
  {"q": "Pacific salmon are described in lecture as 'anadromous'. What does this mean, and how does it explain why they reproduce only once?", "c": ["Born in the ocean, mature in rivers and return to the sea to spawn; the easy downstream trip allows repeated breeding", "They live their whole lives at sea and spawn there every year", "Born in freshwater streams, mature in the ocean and return upstream to spawn; the costly return trip favors one all-out effort", "They move between lakes and rivers but never enter salt water, spawning repeatedly", "They spawn once because, like most vertebrates, they are iteroparous"], "correct": 2, "explanation": "Lecture 04 slide 37: anadromous fish are born in freshwater, mature in the ocean and return to the stream to spawn. Getting back upstream is energetically costly, which is why Pacific salmon are semelparous, putting everything into one reproductive bout.", "t": 4, "src": "04:36-37"},
  {"q": "A sea turtle lays about 100 eggs per clutch and provides no parental care. Most hatchlings die within their first weeks, but the few that survive to adulthood may live for decades. Which survivorship curve does this species show?", "c": ["Type I, because the adults that survive can live for several decades", "Type II, because deaths are spread evenly across the whole life span", "Type III, because most individuals die young and the few survivors then persist", "Type I early in life and Type III later, because the risk of death changes with age", "No curve can be drawn, because the species provides no parental care"], "correct": 2, "explanation": "Lecture 04 slide 41 notes: Type III curves drop steeply at the start and then flatten for the few individuals that survive; they are typical of insects, fish and trees that produce many offspring with little parental care. Long adult lifespan does not make a species Type I; what defines Type I is low early mortality.", "t": 4, "src": "04:41"},
  {"q": "In a lizard population, about 30 percent of the individuals alive at the start of each year die by the end of that year, no matter how old they are. When the number of survivors is plotted on a log scale against age, this produces a straight, steadily declining line. Which survivorship type is this?", "c": ["Type I", "Type II", "Type III", "Type I for juveniles and Type III for adults", "This pattern cannot be represented by any survivorship curve"], "correct": 1, "explanation": "Lecture 04 slide 41 notes: Type II survivorship means relatively constant mortality over the life span (e.g., salamanders, some birds), which plots as a straight line on the log-scale y-axis. Type I is flat early and drops late; Type III drops early and flattens.", "t": 4, "src": "04:41"},
  {"q": "On the survivorship curves shown in lecture, the x-axis is scaled as a percentage of the maximum life span and the y-axis (number surviving) uses a log scale. Why is the x-axis scaled this way?", "c": ["Because all species have roughly the same maximum life span", "So that species with very different life spans, such as insects and humans, can be compared on one graph", "Because survivorship can only be measured in short-lived species", "To make every survivorship curve appear as a straight line", "Because the age of wild animals cannot be measured in years, only as a fraction of the oldest individual"], "correct": 1, "explanation": "Lecture 04 slide 41 notes: the x-axis is scaled as a percentage of maximum life expectancy so that organisms with different life spans can be compared, with the number of survivors on a log-scale y-axis.", "t": 4, "src": "04:41"},
  {"q": "A population of 500 deer has 60 births and 20 deaths in one year. What are the per capita birth rate (b), per capita death rate (d) and per capita rate of increase (r), and by about how many individuals does the population change in that year?", "c": ["b = 0.12, d = 0.04, r = 0.16; the population grows by about 80", "b = 60, d = 20, r = 40; the population grows by 40", "b = 0.12, d = 0.04, r = 0.08; the population grows by about 40", "b = 0.12, d = 0.04, r = 0.08; the population shrinks by about 40", "b = 0.04, d = 0.12, r = -0.08; the population shrinks by about 40"], "correct": 2, "explanation": "Lecture 04 slides 53-57: b = B/N = 60/500 = 0.12 and d = D/N = 20/500 = 0.04, so r = b - d = 0.08. ΔN/Δt = rN = 0.08 × 500 = 40 deer added (which also equals B - D = 60 - 20 = 40). Positive r means the population is growing.", "t": 4, "src": "04:53-57"},
  {"q": "A population of 250 toads has a per capita birth rate (b) of 0.03 per year and a per capita death rate (d) of 0.07 per year. What happens to the population over the next year?", "c": ["r = 0.04; it gains about 10 toads", "r = -0.04; it loses about 10 toads", "r = 0.10; it gains about 25 toads", "r = -0.04; it goes extinct within the year", "r = 0; it stays exactly the same size"], "correct": 1, "explanation": "r = b - d = 0.03 - 0.07 = -0.04. ΔN/Δt = rN = -0.04 × 250 = -10, so the population declines by about 10 toads in the year (Lecture 04 slides 56-57: if r &lt; 0 the population is declining). A negative r means decline, not instant extinction.", "t": 4, "src": "04:56-57"},
  {"q": "The exponential growth model used in lecture, dN/dt = r_max N, describes population growth under which assumption?", "c": ["Resources become scarcer as the population grows", "An idealized environment with unlimited resources and no competition", "The population has reached a fixed carrying capacity", "Births always exactly equal deaths", "The per capita growth rate declines as N increases"], "correct": 1, "explanation": "Lecture 04 slide 58: the exponential model describes growth in an idealized environment (unlimited resources, no competition); under those conditions the per capita rate is at its maximum, r_max, which stays constant while N changes. Limits on growth are the subject of the next lecture.", "t": 4, "src": "04:58-60"},
  {"q": "A yeast culture in fresh, unlimited medium is counted every generation: generation 0 = 50 cells, generation 1 = 100, generation 2 = 200, generation 3 = 400. Which statement about this growth is correct?", "c": ["The per capita growth rate increases with every generation", "A fixed number of cells is added in each generation", "The per capita growth rate is constant while the number of cells added each generation increases", "The population has reached its carrying capacity, so each generation adds the same number of cells", "r is negative because the generation time is so short"], "correct": 2, "explanation": "The population doubles each generation, so the per capita rate (r_max) is constant, but the increment grows from 50 to 100 to 200 cells because dN/dt = r_max N and N keeps increasing. This is the J-shaped exponential curve of Lecture 04 slides 58-60 ('r_max stays constant, population size changes').", "t": 4, "src": "04:58-60"},
  {"q": "Whooping cranes fell to roughly 15 migratory birds in 1940; since then the wild population has grown along a J-shaped curve. According to lecture, this illustrates that exponential growth in nature is typically seen in which situation?", "c": ["Populations that have reached and are holding steady at the carrying capacity of their habitat", "Populations recovering from a catastrophe or new to an area, where resources are not yet limiting", "Laboratory populations of microbes in unlimited medium, but not wild populations", "Populations whose per capita death rate exceeds their per capita birth rate", "Species with Type I survivorship and heavy parental investment"], "correct": 1, "explanation": "Lecture 04 slide 61 notes: exponential growth is 'usually only seen in populations new to an area or recovering from a catastrophic event (whooping cranes)'. With so few birds relative to the available habitat, resources were effectively unlimited and growth followed the J-shaped curve.", "t": 4, "src": "04:61"},
  {"q": "Which of the following is an example of migration, as lecture defined the term, rather than dispersal?", "c": ["A young male wolf leaves the pack he was born in and settles permanently 150 km away", "Dandelion seeds are blown by the wind into a neighboring meadow", "Wildebeest move across the Serengeti each year following seasonal rains and return to where they started", "A juvenile sea turtle swims away from its natal beach and never returns", "A seed sprouts where it fell beneath its parent tree"], "correct": 2, "explanation": "Lecture 04 slide 44: dispersal is movement from one location to another, whereas migration is intentional back-and-forth movement, such as the wildebeest following seasonally available resources. The wolf and turtle examples are one-way movements, i.e. dispersal.", "t": 4, "src": "04:44"},
  {"q": "Monarch butterflies that arrive at the overwintering sites in Mexico each fall have never been there before; their great-great-grandparents left those sites the previous spring. What feature of monarch migration does this illustrate?", "c": ["Monarch migration is really dispersal, not migration, because no individual monarch ever makes the return trip", "Monarch migration is multi-generational: one generation flies south and several complete the return north", "Monarchs find the overwintering sites by following their parents", "Each individual monarch makes the full round trip twice in its life", "Monarchs do not migrate; the fall and spring populations are different species"], "correct": 1, "explanation": "Lecture 04 slides 46-47 (title: 'Monarch migration is multi-generational') and notes: a single generation makes the southward trip, but multiple generations move northward, so a fall monarch travels to a place its great-great-grandparents had been but it had never seen. The population as a whole makes the back-and-forth movement that defines migration (slide 44), even though no individual completes it.", "t": 4, "src": "04:46-47"},
  {"q": "Lecture introduced the temporal description of populations with the term 'demography'. Demography is the study of:", "c": ["The spatial pattern of individuals within a population", "The processes that influence birth, death and population growth rates", "Interactions between different species in a community", "The flow of energy through an ecosystem", "The distribution of biomes across the globe"], "correct": 1, "explanation": "Lecture 04 slides 30-31: demography is the study of processes that influence birth, death and population growth rates. Like a bank account, a population's future size depends on its starting size plus deposits (births) and withdrawals (deaths).", "t": 4, "src": "04:30-31"},
  {"q": "A population of 2,000 lizards has 300 births and 220 deaths in one year. What is the per capita growth rate (r) for that year?", "c": ["−0.04", "0.15", "80", "0.04", "0.26"], "correct": 3, "explanation": "Per capita rates are calculated per individual: b = 300/2000 = 0.15 and d = 220/2000 = 0.11, so r = b − d = 0.04. The value 80 is the net number of individuals added (B − D), not a per capita rate.", "t": 5, "src": "05:8-10, 05:14"},
  {"q": "A population of 500 grasshoppers has r = −0.10 per year and follows the exponential model (ΔN/ΔT = rN). Over the next year the population will:", "c": ["Increase by about 50 individuals", "Decrease by about 50 individuals", "Decrease by about 10 individuals", "Stay the same size, because it is at carrying capacity", "Increase by about 450 individuals"], "correct": 1, "explanation": "ΔN/ΔT = rN = −0.10 × 500 = −50, so the population loses about 50 individuals. A negative r means the population is declining; r = 0 (not r &lt; 0) corresponds to a stable population.", "t": 5, "src": "05:10-12"},
  {"q": "In the lecture example, a population of 100 (50 females, each producing one offspring per generation, no deaths) grows 100 → 150 → 225 → 337. Why does the number of individuals added increase every generation even though each female always has exactly one offspring?", "c": ["The per capita birth rate (b) rises each generation as the population gets larger", "Immigrants join the population in increasing numbers each generation", "The population has overshot its carrying capacity and is correcting", "The per capita death rate falls each generation as the population grows", "Growth is multiplicative: the same per capita rate is applied to a larger N each generation"], "correct": 4, "explanation": "Population growth is multiplicative, not additive. Each generation the fixed per capita rate (b = 0.5) is applied to a larger population, so 50, then 75, then 112 individuals are added.", "t": 5, "src": "05:7-8"},
  {"q": "A population growing logistically has r_max = 0.5, K = 1,200 and currently N = 300. Using dN/dt = r_max × N × (K − N)/K, what is the population growth rate right now?", "c": ["150 individuals per time step", "112.5 individuals per time step", "225 individuals per time step", "0 individuals per time step", "37.5 individuals per time step"], "correct": 1, "explanation": "dN/dt = 0.5 × 300 × (1200 − 300)/1200 = 0.5 × 300 × 0.75 = 112.5. The value 150 ignores the (K − N)/K brake; 37.5 uses N/K instead of (K − N)/K.", "t": 5, "src": "05:19-21"},

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC 2011 Ecology Spring 2026 — Study Guide</title>
<style>
  :root {
    --uf-blue: #0021A5;
    --uf-orange: #FA4616;
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #5a6370;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --error: #dc2626;
    --error-bg: #fee2e2;
    --border: #e2e8f0;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 20px rgba(0,0,0,0.12);
    --radius: 12px;
    --transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* SKIP LINK */
  .skip-link {
    position: absolute;
    top: -40px;
    left: 0;
    background: var(--uf-blue);
    color: white;
    padding: 8px 16px;
    text-decoration: none;
    border-radius: 0 0 4px 0;
    z-index: 10000;
  }
  .skip-link:focus { top: 0; }

  /* NAV */
  nav {
    background: linear-gradient(135deg, var(--uf-blue) 0%, #0035d4 100%);
    color: white;
    border-bottom: 3px solid var(--uf-orange);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }

  nav .inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  nav h1 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .nav-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .streak-display {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .streak-fire {
    font-size: 1.1rem;
    animation: flicker 1.5s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .xp-badge {
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.85rem;
  }

  nav .tabs {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  nav .tabs button {
    background: rgba(255,255,255,0.15);
    border: 2px solid transparent;
    padding: 10px 16px;
    min-height: 44px;
    border-radius: 24px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    transition: var(--transition);
  }

  nav .tabs button:hover { color: white; background: rgba(255,255,255,0.25); }
  nav .tabs button.active {
    background: #D63600;
    color: white;
    box-shadow: 0 4px 12px rgba(221,58,11,0.4);
  }
  nav .tabs button:focus {
    outline: 2px solid white;
    outline-offset: 2px;
  }

  /* MAIN */
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 100px; }

  /* CARDS */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 20px;
    transition: var(--transition);
  }

  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
  .card h2 { font-size: 1.2rem; margin-bottom: 12px; color: var(--uf-blue); font-weight: 700; }
  .card h3 { font-size: 1.05rem; color: var(--uf-blue); margin-bottom: 8px; }

  /* LANDING SCREEN */
  .landing-screen {
    text-align: center;
    padding: 60px 20px;
  }

  .landing-screen h2 {
    font-size: 2.2rem;
    color: var(--uf-blue);
    margin-bottom: 16px;
    font-weight: 800;
  }

  .landing-screen p {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .landing-cta {
    background: linear-gradient(135deg, var(--uf-blue), #0035d4);
    color: white;
    border: none;
    padding: 16px 48px;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,33,165,0.3);
    transition: var(--transition);
  }

  .landing-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,33,165,0.4); }
  .landing-cta:focus { outline: 3px solid var(--uf-orange); outline-offset: 2px; }

  .landing-buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 32px;
    flex-wrap: wrap;
  }

  .landing-quick {
    background: var(--card);
    color: var(--uf-blue);
    border: 2px solid var(--uf-blue);
    padding: 16px 40px;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    transition: var(--transition);
  }
  .landing-quick:hover { background: var(--uf-blue); color: white; transform: translateY(-2px); }
  .landing-quick:focus { outline: 3px solid var(--uf-orange); outline-offset: 2px; }

  .landing-hint {
    font-size: 0.85rem !important;
    color: #64748b !important;
    margin-top: 14px !important;
  }

  /* QUIZ TOOLBAR */
  .quiz-toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .topic-select {
    flex: 1;
    min-width: 160px;
    padding: 12px 14px;
    min-height: 44px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    cursor: pointer;
    transition: var(--transition);
    appearance: auto;
  }
  .topic-select:focus { border-color: var(--uf-blue); outline: 2px solid var(--uf-blue); outline-offset: 1px; }

  .reset-btn {
    padding: 12px 20px;
    min-height: 44px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--card);
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
  }
  .reset-btn:hover, .reset-btn:active { border-color: #D63600; color: #D63600; }
  .reset-btn:focus { outline: 2px solid var(--uf-blue); outline-offset: 1px; }

  .score-bar {
    font-size: 0.85rem;
    font-weight: 600;
    color: #555e68;
    margin-bottom: 14px;
    padding: 0 2px;
  }

  /* PROGRESS (unused but kept for compat) */
  .progress-section {
    background: linear-gradient(135deg, rgba(0,33,165,0.05), rgba(250,70,22,0.05));
    padding: 20px;
    border-radius: var(--radius);
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
  }

  .progress-ring {
    width: 80px;
    height: 80px;
    position: relative;
  }

  .progress-ring svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }

  .progress-ring circle {
    fill: none;
    stroke-width: 6;
  }

  .progress-ring-bg {
    stroke: var(--border);
  }

  .progress-ring-fill {
    stroke: url(#gradient);
    stroke-dasharray: 251;
    stroke-dashoffset: 251;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    stroke-linecap: round;
  }

  .progress-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .progress-label .num {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--uf-blue);
  }

  .progress-label .denom {
    font-size: 0.875rem;
    color: var(--muted);
  }

  /* STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    transition: var(--transition);
  }

  .stat-card:hover { border-color: var(--uf-blue); }

  .stat-card .value {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--uf-blue), var(--uf-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-card .label {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* TOPIC FILTERS */
  .topic-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .topic-pill {
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 2px solid var(--border);
    background: var(--card);
    cursor: pointer;
    transition: var(--transition);
    color: var(--text);
  }

  .topic-pill:hover {
    border-color: var(--uf-blue);
    background: rgba(0,33,165,0.05);
  }

  .topic-pill.active {
    border-color: var(--uf-orange);
    background: var(--uf-orange);
    color: white;
    box-shadow: 0 4px 12px rgba(250,70,22,0.3);
  }

  .topic-pill:focus { outline: 2px solid var(--uf-blue); outline-offset: 2px; }

  /* MODE TOGGLE */
  .mode-toggle {
    display: flex;
    gap: 6px;
    background: var(--border);
    border-radius: var(--radius);
    padding: 6px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: var(--transition);
  }

  .mode-btn.active {
    background: var(--card);
    color: var(--uf-blue);
    box-shadow: var(--shadow);
  }

  .mode-btn:focus { outline: 2px solid var(--uf-blue); outline-offset: -2px; }

  /* QUESTION AREA */
  .q-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

  .q-progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .q-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--uf-blue), var(--uf-orange));
    border-radius: 4px;
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .q-number {
    display: inline-block;
    background: linear-gradient(135deg, var(--uf-blue), #0035d4);
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .q-text {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.7;
    color: var(--text);
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
    text-align: left;
    font-size: 0.95rem;
    line-height: 1.6;
    transition: var(--transition);
    position: relative;
  }

  .choice-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(0,33,165,0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .choice-btn:hover:not(.disabled)::before,
  .choice-btn:active:not(.disabled)::before { opacity: 1; }
  .choice-btn:hover:not(.disabled),
  .choice-btn:active:not(.disabled) { border-color: var(--uf-blue); }

  .choice-btn:focus {
    outline: 3px solid var(--uf-orange);
    outline-offset: 1px;
  }

  .choice-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    border-radius: 50%;
    font-weight: 700;
    font-size: 0.9rem;
    background: var(--border);
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 2px;
    transition: var(--transition);
  }

  .choice-btn.correct {
    border-color: var(--success);
    background: var(--success-bg);
  }

  .choice-btn.correct .choice-letter {
    background: var(--success);
    color: white;
    animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .choice-btn.wrong {
    border-color: var(--error);
    background: var(--error-bg);
  }

  .choice-btn.wrong .choice-letter {
    background: var(--error);
    color: white;
    animation: shake 0.4s;
  }

  .choice-btn.disabled {
    cursor: default;
    opacity: 0.7;
  }

  @keyframes bounceIn {
    0% { transform: scale(0.5); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* FEEDBACK */
  .feedback {
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    line-height: 1.6;
    display: none;
    animation: slideDown 0.3s ease;
    role: alert;
  }

  .feedback.correct {
    background: var(--success-bg);
    border-left: 4px solid var(--success);
    color: var(--text);
  }

  .feedback.wrong {
    background: var(--error-bg);
    border-left: 4px solid var(--error);
    color: var(--text);
  }

  .feedback.show { display: block; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback-title {
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* EXPLANATION */
  .explanation {
    margin-top: 12px;
    padding: 12px;
    background: rgba(0,33,165,0.08);
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text);
  }

  /* NAVIGATION */
  .q-nav {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn-nav {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-next {
    background: linear-gradient(135deg, var(--uf-blue), #0035d4);
    color: white;
    box-shadow: 0 4px 12px rgba(0,33,165,0.2);
  }

  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,33,165,0.3); }
  .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-next:focus { outline: 2px solid var(--uf-orange); outline-offset: 2px; }

  /* CONFETTI */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    animation: confettiFall 3s ease-in forwards;
  }

  @keyframes confettiFall {
    to {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* ACHIEVEMENTS */
  .achievement-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 2px solid var(--uf-orange);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.5s ease;
    z-index: 1000;
    max-width: 280px;
    width: calc(100% - 40px);
  }

  @keyframes slideUp {
    from { transform: translateY(100px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .achievement-toast .icon { font-size: 2rem; margin-bottom: 8px; }
  .achievement-toast .text { font-weight: 700; color: var(--text); }

  /* CONCEPTS TAB */
  .concept-section { margin-bottom: 20px; }

  .concept-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    cursor: pointer;
    border-radius: var(--radius);
    background: var(--card);
    border: 2px solid var(--border);
    box-shadow: var(--shadow);
    transition: var(--transition);
  }

  .concept-header:hover, .concept-header:active {
    border-color: var(--uf-blue);
    box-shadow: var(--shadow-lg);
  }

  .concept-header:focus { outline: 2px solid var(--uf-orange); outline-offset: 2px; }
  .concept-header:focus-within { outline: 2px solid var(--uf-orange); outline-offset: 2px; }

  .concept-header h3 {
    font-size: 1.05rem;
    color: var(--uf-blue);
    font-weight: 700;
  }

  .concept-header .arrow {
    transition: transform 0.3s;
    font-size: 1.3rem;
    color: var(--muted);
  }

  .concept-header.open .arrow { transform: rotate(180deg); color: var(--uf-blue); }

  .concept-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    background: var(--card);
    border: 2px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 0 16px;
  }

  .concept-body.open {
    max-height: 2500px;
    padding: 16px;
  }

  .concept-body p { margin-bottom: 12px; font-size: 0.95rem; line-height: 1.7; }

  .concept-body ul { padding-left: 20px; margin-bottom: 12px; }
  .concept-body li { font-size: 0.95rem; margin-bottom: 6px; line-height: 1.6; }

  .key-term { font-weight: 700; color: var(--uf-blue); }

  .formula-box {
    background: linear-gradient(135deg, rgba(0,33,165,0.05), rgba(250,70,22,0.05));
    padding: 12px 16px;
    border-radius: 8px;
    border-left: 3px solid var(--uf-orange);
    font-family: 'Courier New', monospace;
    margin: 10px 0;
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--text);
    overflow-x: auto;
  }

  /* FORMULAS TAB */
  .formula-grid {
    display: grid;
    gap: 12px;
  }

  .formula-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: var(--transition);
  }

  .formula-card:hover { border-color: var(--uf-orange); box-shadow: var(--shadow-lg); }

  .formula-card .name {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 8px;
    color: var(--uf-blue);
  }

  .formula-card .eq {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    margin-bottom: 8px;
    color: var(--text);
    padding: 8px;
    background: linear-gradient(135deg, rgba(0,33,165,0.05), transparent);
    border-radius: 6px;
    overflow-x: auto;
  }

  .formula-card .desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }

  .formula-card .terms {
    margin: 8px 0 10px;
    padding-left: 4px;
  }

  .formula-card .term {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.7;
    padding: 2px 0;
    border-bottom: 1px solid var(--border);
  }

  .formula-card .term:last-child { border-bottom: none; }

  .formula-card .usage {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 2px solid var(--border);
  }

  /* RESULTS */
  .results-card {
    text-align: center;
    padding: 40px 20px;
  }

  .results-score {
    font-size: 4rem;
    font-weight: 800;
    color: var(--uf-blue);
    background: linear-gradient(135deg, var(--uf-blue), var(--uf-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    animation: slideDown 0.5s ease;
  }

  .results-message {
    font-size: 1.3rem;
    color: var(--text);
    margin-bottom: 30px;
    font-weight: 600;
  }

  .results-breakdown {
    text-align: left;
    margin-top: 30px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .results-breakdown h3 {
    color: var(--uf-blue);
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .topic-result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;

<script>
// ============================================================
// TOPICS
// ============================================================
const TOPICS = {
  1: "Intro to Ecology",
  2: "Climate",
  3: "Biomes",
  4: "Population Ecology I",
  5: "Population Ecology II",
  6: "Community Ecology",
  7: "Food Webs & Trophic Cascades",
  8: "Island Biogeography & Biodiversity Patterns",
  9: "Energy Flow, Productivity, Water & Nitrogen Cycles",
  10: "Phosphorus & Carbon Cycles; Biodiversity–Ecosystem Function",
  11: "Conservation Biology",
  0: "Integrative"
};

// ============================================================
// ALL QUESTIONS: 100 original items (audited Oct 2026; corrected, retagged)
// followed by 195 new items. src = lecture:slides for review.
// ============================================================
const ALL_QUESTIONS = [
  {"q": "Which of the following is an abiotic factor?", "c": ["A predator hunting its prey", "Competition between two plant species", "Parasites living inside a host organism", "Temperature fluctuations in a desert", "Pollination by bees"], "correct": 3, "explanation": "Temperature is a physical (abiotic) factor — it is not a living organism or a biological interaction.", "t": 1},
  {"q": "All the populations of different species living and interacting in a particular area make up a(n):", "c": ["Population", "Organism", "Biosphere", "Community", "Ecosystem"], "correct": 3, "explanation": "A community consists of all populations of different species living and interacting in an area.", "t": 1},
  {"q": "The coevolutionary arms race between the Rough-skinned Newt and the Common Garter Snake is an example of:", "c": ["Mutualism", "Commensalism", "Coevolution (reciprocal selection)", "Genetic drift", "Convergent evolution"], "correct": 2, "explanation": "Reciprocal selection occurs when two species exert selective pressure on each other, driving coevolution.", "t": 1},
  {"q": "Which level of ecological organization encompasses all ecosystems on Earth?", "c": ["Community", "Ecosystem", "Population", "Biome", "Biosphere"], "correct": 4, "explanation": "The biosphere is the sum of all ecosystems on Earth — the global ecological system.", "t": 1},
  {"q": "Which of the following best illustrates how ecology is relevant to human well-being?", "c": ["The study of cellular respiration in mitochondria", "Studying the chemical structure of DNA", "The classification of beetles by taxonomists", "Mapping the human genome", "Understanding how pollination supports food crop production"], "correct": 4, "explanation": "Pollination is an ecological process that directly benefits human agriculture and food production.", "t": 1},
  {"q": "The Intertropical Convergence Zone (ITCZ) is characterized by:", "c": ["Descending dry air and desert formation", "Rising warm, moist air and high rainfall", "Strong westerly winds", "Cold polar air masses", "High atmospheric pressure and very little precipitation"], "correct": 1, "explanation": "The ITCZ is where trade winds converge near the equator, causing warm, moist air to rise and produce heavy rainfall.", "t": 2},
  {"q": "The Coriolis effect causes moving air and water in the Northern Hemisphere to be deflected:", "c": ["To the left", "To the right", "Toward the equator", "Straight up", "In random directions"], "correct": 1, "explanation": "Due to Earth's rotation, moving objects deflect to the right in the Northern Hemisphere and to the left in the Southern Hemisphere.", "t": 2},
  {"q": "The Gobi Desert of central Asia (about 42° N) lies just north of the Himalayas, and the moisture-bearing monsoon winds of that region blow in from the Indian Ocean to the south. According to lecture, why is the Gobi so dry?", "c": ["It sits directly beneath the descending, dry limb of a Hadley cell, as the Sahara does", "The Himalayas block the monsoon, so air that rained out on their southern slopes descends dry over the Gobi", "The Coriolis effect deflects the monsoon winds westward before they can reach central Asia", "Cold currents along the Chinese coast chill the air so that it holds too little moisture to reach inland", "The Gobi is so far from any ocean that wind-driven air masses never reach it"], "correct": 1, "explanation": "Lecture 03 slide 24 notes: the Himalayan range blocks the monsoons from the Indian Ocean, forming the Gobi in their rain shadow. Moist air forced up the windward (southern) slopes cools and drops its rain; the air that crosses the crest and descends the leeward (northern) side is dry (Lecture 02 slide 28). At 42° N the Gobi is well north of the 30° desert belt made by descending Hadley-cell air, and neither the Coriolis effect nor cold currents was the explanation lecture gave.", "t": 2},
  {"q": "Which of the following is the primary greenhouse gas responsible for recent global warming?", "c": ["Oxygen (O₂)", "Nitrogen (N₂)", "Carbon dioxide (CO₂)", "Argon (Ar)", "Hydrogen (H₂)"], "correct": 2, "explanation": "CO₂ is the primary greenhouse gas driving recent anthropogenic climate change.", "t": 2},
  {"q": "Ocean currents influence regional climates primarily by:", "c": ["Creating the Coriolis deflection of winds", "Blocking wind patterns", "Increasing the salinity of coastal waters", "Redistributing heat from the equator toward the poles", "Generating volcanic activity"], "correct": 3, "explanation": "Ocean currents are a major mechanism for redistributing thermal energy from equatorial to polar regions.", "t": 2},
  {"q": "A biome is best defined as:", "c": ["A specific geographic location with unique species", "A major life zone characterized by its dominant vegetation and climate", "Any area where organisms interact", "A group of populations of different species", "An area defined by political boundaries"], "correct": 1, "explanation": "Biomes are large-scale ecological regions defined primarily by their dominant vegetation type and the climate that supports it.", "t": 3},
  {"q": "The observation that grasslands on different continents have similar-looking plants and animals, even when unrelated, is an example of:", "c": ["Convergent evolution", "Adaptive radiation", "Genetic drift", "Coevolution", "Natural selection within a single lineage"], "correct": 0, "explanation": "Convergent evolution produces similar traits in unrelated organisms facing similar environmental pressures.", "t": 3},
  {"q": "Which terrestrial biome has the highest species diversity?", "c": ["Tropical rain forest", "Boreal forest", "Tundra", "Temperate forest", "Temperate grassland"], "correct": 0, "explanation": "Tropical rain forests support the greatest biodiversity of any terrestrial biome due to high energy, moisture, and evolutionary time.", "t": 3},
  {"q": "The boreal forest (taiga) is dominated by cone-shaped, evergreen conifers. Which pair of reasons did lecture give for this?", "c": ["Their needles absorb heat from the snow, and their shallow roots stay above the frozen soil", "Their cone shape sheds heavy snow, and keeping needles year-round avoids regrowing leaves each short season", "They need the warm summers of high latitudes, and their broad leaves capture the long summer days", "They grow best on fertile soils, and the rich boreal soils let them outcompete deciduous trees", "Their deep roots reach water trapped beneath the permafrost, and their needles are toxic to browsing moose"], "correct": 1, "explanation": "Lecture 03 slide 36 notes: conifers are shaped like a cone so they can slough off heavy loads of snow without breaking, and they are evergreen because the soils are poor and the growing season is short, so it is too expensive (and there is not enough time) to drop leaves and rebuild them every year. The needles' waxy coating and small surface area also limit water loss.", "t": 3},
  {"q": "Desert plants are adapted to conserve water. Which is a common adaptation?", "c": ["Broad, thin leaves", "Fleshy stems and leaves with thick cuticles", "Tall growth to access canopy light", "Stomata that stay open throughout the hot daytime", "Deciduous leaves that drop in winter"], "correct": 1, "explanation": "Fleshy stems (succulence) store water, and thick cuticles minimize evaporative water loss — classic xerophyte adaptations.", "t": 3},
  {"q": "Population ecology is the study of:", "c": ["How births, deaths, and dynamic forces regulate populations", "How populations of different species interact within a community", "How ecosystems recycle nutrients", "The evolution of new species", "Classification of organisms"], "correct": 0, "explanation": "L4 slide 6: population ecology is the study of births, deaths and the dynamic forces that regulate a population. Interactions among species in a community are community ecology; the remaining choices describe ecosystem ecology, evolution and taxonomy.", "t": 4},
  {"q": "In drought years, female lizards in a population grow less and lay fewer eggs than in wet years, even though most adults survive. Which concept from lecture BEST explains this pattern?", "c": ["The principle of allocation: with fewer resources, maintenance takes priority over growth and reproduction", "Semelparity: the lizards are storing energy for one large reproductive effort in a later year", "Type I survivorship: because adult mortality is low, the lizards have little need to reproduce", "Exponential growth: the population is expanding too quickly for females to find enough food", "Uniform dispersion: the lizards are spaced so far apart that few females can find mates"], "correct": 0, "explanation": "Lecture 04 slides 33-35: an organism must divide limited resources among competing life functions (reproduction, growth, defense, maintenance), and in stressful conditions the first priority is maintaining the body, so most energy goes to maintenance and less is left for growth and reproduction. This is the principle of allocation, the source of life-history trade-offs. Semelparity, survivorship type, the growth model and dispersion do not describe how an individual budgets resources.", "t": 4},
  {"q": "In the exponential growth model, if a population of 200 has b = 0.06 and d = 0.02, how many individuals are added per time period?", "c": ["4", "16", "12", "8", "40"], "correct": 3, "explanation": "r = b − d = 0.06 − 0.02 = 0.04. ΔN = r × N = 0.04 × 200 = 8 individuals per time period.", "t": 4},
  {"q": "A young male wolf leaves the pack where it was born, travels 200 km and settles permanently in a new territory. Each year, wildebeest herds move across the Serengeti following the rains and later return to where they started. Using the definitions from lecture, the wolf's movement is ______ and the wildebeest movement is ______.", "c": ["migration; dispersal", "dispersal; migration", "dispersal; dispersal", "migration; migration", "clumped dispersion; uniform dispersion"], "correct": 1, "explanation": "Lecture 04 slide 44: dispersal is movement from one location to another, while migration is intentional back-and-forth movement. The wolf makes a one-way move to a new location (dispersal); the wildebeest repeat a seasonal round trip (migration), the example lecture used. Dispersion patterns describe the spacing of individuals, not their movement.", "t": 4},
  {"q": "Exponential population growth is most likely when:", "c": ["Resources are limited", "Population is at carrying capacity", "A species colonizes a new, resource-rich environment", "Predators are abundant", "Population is very large"], "correct": 2, "explanation": "Exponential growth occurs when resources are effectively unlimited — such as when a species first colonizes a new, empty habitat.", "t": 4},
  {"q": "In the logistic growth model, what does K represent?", "c": ["The intrinsic rate of increase", "The death rate", "The initial population size", "The carrying capacity of the environment", "The birth rate"], "correct": 3, "explanation": "K is the carrying capacity — the maximum population size that an environment can sustainably support.", "t": 5},
  {"q": "Which is a density-independent factor?", "c": ["Intraspecific competition", "Disease transmission between individuals", "A severe hurricane destroying habitat", "Territorial aggression between males", "Increased parasitism at high population density"], "correct": 2, "explanation": "Density-independent factors affect populations regardless of density. A hurricane kills the same proportion of organisms whether the population is sparse or dense.", "t": 5},
  {"q": "An insect-pollinated plant in a sparse population has low seed production even though water, light and nutrients are abundant. This is most likely due to:", "c": ["An Allee effect: pollination fails at low density", "Density-independent environmental stress", "Negative density dependence caused by crowding", "The population being in its exponential growth phase", "The population having reached carrying capacity"], "correct": 0, "explanation": "At very low densities pollinators are less likely to visit sparse flower patches, so per capita reproduction falls: positive density dependence, the Allee effect (LO 3). Negative density dependence would require crowding, and the stem rules out resource limitation.", "t": 5, "src": "05:34-38; LO 3"},
  {"q": "According to lecture, why has human population growth over the past few centuries looked exponential, something unusual among organisms?", "c": ["Technology cut death rates and repeatedly raised the carrying capacity", "Humans are not subject to density-dependent regulation of any kind", "The human intrinsic rate of increase (r_max) has evolved upward", "Global immigration has exceeded global emigration for centuries", "Fertility per woman is higher today than at any time in the past"], "correct": 0, "explanation": "Slides 42-43 attribute the exponential-looking human curve to technology (vaccines, sanitation, antibiotics, food production) that lowered death rates and raised K over time. Fertility has fallen (about 5 to 2.5 children per woman), the world is a closed population so global immigration cannot exceed emigration, and nothing in lecture suggests r_max evolved.", "t": 5, "src": "05:42-43"},
  {"q": "When a population stops changing in size, it has reached ________ and r = ________.", "c": ["exponential growth / positive", "maximum fitness / one", "stable equilibrium / negative", "carrying capacity / zero", "minimum density / infinity"], "correct": 3, "explanation": "At carrying capacity (K), births equal deaths, so r = 0 and population size stabilizes.", "t": 5},
  {"q": "Which interaction is correctly paired with its +/− classification?", "c": ["Parasitism / +−", "Predation / ++", "Mutualism / +−", "Competition / ++", "Commensalism / −0"], "correct": 0, "explanation": "Parasitism is +/− (parasite benefits, host is harmed). Mutualism is +/+. Competition is −/−. Commensalism is +/0.", "t": 6},
  {"q": "The relationship between mycorrhizal fungi and plant roots is:", "c": ["Mutualism", "Parasitism", "Commensalism", "Competition", "Predation"], "correct": 0, "explanation": "Mycorrhizal fungi provide the plant with nutrients; the plant provides the fungus with carbohydrates — mutualism (+/+).", "t": 6},
  {"q": "Species diversity takes into account both:", "c": ["Population size and growth rate", "Species richness and evenness", "Birth rate and death rate", "Immigration and emigration", "Predation and parasitism"], "correct": 1, "explanation": "Diversity = richness (number of species) + evenness (relative abundance of each species).", "t": 6},
  {"q": "A community with 10 species where one makes up 91% of individuals has:", "c": ["High richness and high evenness", "High richness and low evenness", "Low richness and high evenness", "Low richness and low evenness", "Maximum diversity"], "correct": 1, "explanation": "Richness is high (10 species), but evenness is low (dominated by one species). Overall diversity is moderate to low.", "t": 6},
  {"q": "In a food web, primary consumers are:", "c": ["Herbivores that eat producers", "Carnivores that eat herbivores", "Decomposers that break down dead matter", "Producers that photosynthesize", "Omnivores eating both plants and animals"], "correct": 0, "explanation": "Primary consumers are herbivores (the first step above producers in a food chain).", "t": 7},
  {"q": "Top-down control occurs when:", "c": ["Nutrient levels in the soil limit plant growth", "Predators regulate the abundance of their prey", "Plants regulate the growth of herbivores", "Decomposers limit nutrient cycling", "Rainfall determines species richness"], "correct": 1, "explanation": "Top-down control means higher trophic levels (predators) regulate lower levels (prey) in the food web.", "t": 7},
  {"q": "After wolves were reintroduced to Yellowstone in 1995, the lecture reported that:", "c": ["Elk declined and riparian vegetation such as willow recovered", "Elk increased because coyotes, their main predator, declined", "Coyote numbers increased because wolves reduced competition", "Streams became wider, shallower and warmer as banks eroded", "Beavers disappeared because wolves preyed on them"], "correct": 0, "explanation": "Slides 45-48: wolves reduced elk (top-down control), vegetation and willows recovered, stream banks stabilized so streams became deeper and cooler, coyotes decreased, and beavers recolonized. Wider, warmer streams and rising coyote numbers describe the wolf-free period (1926-1995), not the recovery.", "t": 7, "src": "07:45-48"},
  {"q": "An inverted biomass pyramid in aquatic ecosystems occurs because:", "c": ["Aquatic organisms are smaller than terrestrial organisms", "There are fewer trophic levels in aquatic than terrestrial systems", "Large predatory fish consume all the algae", "Phytoplankton have rapid turnover; standing crop is low but productivity is high", "Water density increases biomass"], "correct": 3, "explanation": "Phytoplankton reproduce rapidly, so little standing biomass accumulates, yet production is high — hence standing crop can be less than the zooplankton above them.", "t": 7},
  {"q": "Adding piscivorous (fish-eating) fish to a lake with an algae problem would be expected to:", "c": ["Decrease zooplankton and increase algae", "Increase algae indirectly through a trophic cascade", "Increase zooplankton and decrease algae", "Eliminate competition among algae species", "Have no effect on the plankton community because fish do not eat algae"], "correct": 2, "explanation": "Piscivores eat zooplanktivorous fish, so zooplankton are released from predation, increase, and graze algae down (slide 21-22). This four-level trophic cascade is the basis of lake biomanipulation.", "t": 7},
  {"q": "The latitudinal diversity gradient describes:", "c": ["Decreasing diversity as you move from equator to poles", "Increasing diversity at higher altitudes", "Changing seasons at different latitudes", "Ocean currents flowing toward the equator", "More species in deserts than rainforests"], "correct": 0, "explanation": "Species richness is highest at the equator and decreases toward the poles — a fundamental pattern in ecology.", "t": 8},
  {"q": "According to island biogeography, which island has HIGHEST species richness?", "c": ["Small and near the mainland", "Small and far from the mainland", "Large and far from the mainland", "Large and near the mainland", "All islands have equal richness"], "correct": 3, "explanation": "Large islands (lower extinction) + near mainland (higher immigration) = highest equilibrium richness.", "t": 8},
  {"q": "MacArthur and Wilson's theory of island biogeography was developed for oceanic islands. According to lecture, to which of the following does it ALSO apply?", "c": ["Habitat fragments, such as a forest patch surrounded by pasture", "Continuous mainland habitat with no isolation from source populations", "Islands of volcanic origin, but not those on continental shelves", "Islands in the tropics, but not those at higher latitudes", "Islands within a few kilometers of a mainland, but not distant ones"], "correct": 0, "explanation": "Slide 28: 'islands' can be actual islands or habitat islands, patches of one habitat type surrounded by a 'sea' of a different habitat. That is why the theory underpins fragment and corridor conservation (slides 46-48). Island size and distance from the source change the predicted richness (slides 35-39), but the model applies to any island or habitat patch, whatever its origin or latitude, and continuous mainland habitat is the source, not an island.", "t": 8, "src": "08:28, 08:46-48"},
  {"q": "In island-biogeography terms, how does a wildlife corridor between two forest fragments change the dynamics of each fragment?", "c": ["It raises immigration into each fragment, lowering its extinction risk", "It raises the number of species in the mainland source pool", "It lowers immigration by funneling dispersers into the corridor", "It increases edge habitat, which speeds species turnover", "It reduces interspecific competition by separating competitors"], "correct": 0, "explanation": "Corridors increase landscape connectivity (slide 48). In the model, a connected fragment behaves like a 'near' island: more immigrants arrive, and those immigrants can replenish declining populations (rescue effect, slide 39 notes), so extinction risk in the fragment falls. The corridor does not change the mainland pool or separate competitors.", "t": 8, "src": "08:39, 08:47-48"},
  {"q": "The First Law of Thermodynamics states that energy:", "c": ["Increases steadily as an organism grows larger", "Is created from nothing during photosynthesis", "Is destroyed during cellular respiration", "Is neither created nor destroyed but can change form", "Can be recycled by decomposers in the same way nutrients are"], "correct": 3, "explanation": "The First Law: energy is neither created nor destroyed, only transferred and transformed (sunlight → chemical energy → heat). Implication: energy in = energy stored + reflected + dissipated as heat.", "t": 9},
  {"q": "Decomposers are critical to an ecosystem because they:", "c": ["Capture solar energy and convert it into chemical energy for consumers", "Make up most of the living biomass found in a typical ecosystem", "Eat living plant tissue and pass that energy up the grazing food chain", "Transfer energy from one trophic level to the next with no loss as heat", "Convert dead organic matter into inorganic forms that producers can take up again"], "correct": 4, "explanation": "Decomposers (mainly prokaryotes and fungi) break down dead organic matter and return C, N and P to inorganic pools that primary producers reuse, closing the matter cycle (slides 9, 12). Energy is not recycled; it is lost as heat at every transfer.", "t": 9},
  {"q": "Among terrestrial biomes, which has the HIGHEST NPP?", "c": ["Desert", "Tundra", "Tropical rainforest", "Boreal forest", "Temperate grassland"], "correct": 2, "explanation": "Tropical rainforests have high temperature, rainfall, and year-round growing season — all conditions for high NPP.", "t": 9},
  {"q": "Marine NPP is highest near coastlines and in upwelling zones because these areas:", "c": ["receive the most rainfall, which dilutes the salt that limits phytoplankton growth", "are shallow enough for sunlight to reach the sea floor across their whole area", "lie within the tropics, where surface water temperatures are highest all year", "receive steady inputs of nutrients from land runoff or from nutrient-rich deep water", "sit near hydrothermal vents that release nutrients directly into surface waters"], "correct": 3, "explanation": "Light is available throughout the photic zone everywhere; what limits marine NPP is nutrients (N and P). Coasts get them from land runoff, upwelling zones from deep water, and the open ocean gets neither, so it is least productive.", "t": 9},
  {"q": "Nitrogen fixation is the process by which:", "c": ["Plant roots take up nitrate ions dissolved in soil water", "Microbes convert nitrate back into N₂ gas that returns to the air", "Decomposers break proteins in dead tissue down into ammonia", "Plant leaves release surplus nitrogen back into the air as N₂ gas", "Certain bacteria break the N₂ triple bond and convert it to ammonia"], "correct": 4, "explanation": "Slide 45 notes: N₂ (78% of the atmosphere) is held together by a triple bond that only certain microbes can break; nitrogen fixation converts it to ammonia and other forms that organisms can use. Denitrifying microbes do the reverse, returning N₂ to the atmosphere. Plant uptake of nitrate, decomposition to ammonia, and leaf release of N₂ are not fixation.", "t": 9},
  {"q": "Excess nitrogen runoff leads to dead zones because:", "c": ["Nitrogen is directly toxic to fish at the concentrations found in farm runoff", "Nitrogen-rich water blocks sunlight, so phytoplankton cannot photosynthesize", "Excess N fertilizes algal blooms, and decomposition of the dead algae uses up oxygen", "Nitrogen lowers the temperature of coastal water below what most fish tolerate", "Nitrogen reacts with seawater to form acids that damage the gills of fish"], "correct": 2, "explanation": "Eutrophication: extra nutrients stimulate phytoplankton growth; the algae and the decomposers that process their dead bodies consume oxygen, dropping it below levels fish and other animals can tolerate (slide 50; Gulf of Mexico dead zone).", "t": 9},
  {"q": "The primary source of new phosphorus entering ecosystems is:", "c": ["Nitrogen-fixing bacteria", "Rivers from the ocean", "Atmospheric deposition", "Volcanic activity", "Rock weathering and erosion"], "correct": 4, "explanation": "Phosphorus has no gaseous cycle; it enters ecosystems slowly through physical weathering of phosphate-containing rocks.", "t": 10},
  {"q": "Human activity has added roughly 1.6 trillion tons of carbon to the atmosphere, more than the mass of every living thing on Earth. According to lecture, when did this release begin to accelerate dramatically, and what activity drove it?", "c": ["The Industrial Revolution, through large-scale burning of fossil fuels", "The end of the last ice age, through the thawing of permafrost", "The origin of agriculture, through the clearing of forests for crops", "The mid-twentieth century, through the manufacture of nitrogen fertilizer", "The 1970s, through the rapid growth of worldwide cement production"], "correct": 0, "explanation": "Slides 20-21: humans dramatically accelerated fossil fuel burning in the Industrial Revolution; carbon emissions from fossil fuels have increased since the pre-industrial period, and about 1.6 trillion tons of carbon have been added since then. Fossil fuel burning and cement manufacture together are the largest human carbon flux in the lecture figure (~9.5 Pg/yr), far above land-use change (~1.7) or biomass burning (~0.3).", "t": 10, "src": "10:2, 10:19-21"},
  {"q": "The insurance effect means that:", "c": ["Communities with more species fluctuate more from year to year because more species can crash", "Each species in a community contributes the same amount to total ecosystem function", "The most abundant species decides how a community responds to a drought year", "Species respond differently to stress, so some compensate when others fail, keeping function stable", "Species richness affects average productivity but has no effect on how stable it is"], "correct": 3, "explanation": "Insurance (portfolio) effect, slide 45: different species respond differently to environmental stress, so when drought-sensitive species crash, drought-tolerant species compensate; more species means more stable ecosystem function across years, like a diversified investment portfolio.", "t": 10},
  {"q": "In biodiversity-ecosystem function research, complementarity means that:", "c": ["Species in a mixture compete so intensely that the best competitor excludes the rest", "A mixture is productive when it happens to contain a single superstar species", "Predators and prey in a community keep each other's numbers in balance over time", "Species use resources differently, so together they capture more than any one species alone", "Drought-tolerant species make up for the losses when drought-sensitive species crash"], "correct": 3, "explanation": "Complementarity (niche partitioning), slide 44: species differ in root depth, light needs and nutrient strategies, so a diverse community captures more total resources than any monoculture can; it also includes facilitation, e.g., nitrogen-fixing legumes boosting neighbors. The single-superstar option describes the sampling effect, and the drought-compensation option describes the insurance effect.", "t": 10},
  {"q": "Conservation biology studies phenomena affecting the:", "c": ["Evolution of new species only", "Loss and preservation of biodiversity", "Climate patterns only", "Photosynthesis mechanisms", "Classification of organisms"], "correct": 1, "explanation": "Conservation biology applies ecological principles to prevent species extinction and preserve ecosystems.", "t": 11},
  {"q": "Which list correctly names the three levels of biodiversity discussed in lecture?", "c": ["Genetic, species, and ecosystem diversity", "Genetic, population, and community diversity", "Species, trophic, and biome diversity", "Individual, population, and species diversity", "Habitat, landscape, and global diversity"], "correct": 0, "explanation": "Lecture 11 (slides 5-6): biodiversity is considered at three levels — genetic diversity within species, species diversity within communities, and ecosystem diversity across landscapes. Trophic levels, individuals and landscapes are not levels of biodiversity as defined in lecture.", "t": 11},
  {"q": "Inbreeding depression in a small, isolated population leads to:", "c": ["Faster adaptation, because related parents pass on well-matched combinations of alleles", "Fewer harmful alleles being expressed, because relatives tend to share the same beneficial genes", "Higher reproductive rates, because relatives are more readily available as mates", "Reduced survival and reproduction, because harmful recessive alleles are more often expressed", "Greater genetic diversity, because mating among relatives shuffles alleles more thoroughly"], "correct": 3, "explanation": "Slide 7 defines inbreeding depression as reduced survival resulting from mating with a relative; it happens more often in small populations. Relatives share alleles, so harmful recessive alleles are more likely to become homozygous and be expressed, as in the Florida panther's heart defects and immune deficiencies.", "t": 11},
  {"q": "In the source-sink model, a source population is one in which:", "c": ["Mortality exceeds reproduction, so it persists only because immigrants keep arriving from elsewhere", "Births and deaths are exactly balanced, so its size does not change from one year to the next", "Immigration is zero, so it is described by the closed BD model rather than the BIDE model", "Reproduction exceeds mortality, so it produces surplus individuals that can disperse to other patches", "Local extinction has occurred, so it is waiting to be recolonized from neighboring patches"], "correct": 3, "explanation": "Slides 39-41: a source population is one where reproduction exceeds mortality (r > 0); its surplus individuals disperse to sinks, where mortality exceeds reproduction and which would decline without immigration. Protecting source habitat is usually the conservation priority.", "t": 11},
  {"q": "The BIDE model differs from BD by accounting for:", "c": ["Biodiversity", "Environmental change", "Individual-based dynamics", "Immigration and emigration (open populations)", "Disease impact"], "correct": 3, "explanation": "BIDE: Births + Immigration − Deaths − Emigration. BD ignores movement; BIDE is the full open population model.", "t": 11},
  {"q": "A hurricane kills 40 of the 50 remaining individuals of an island bird species. A mainland population of 5,000 of the same species loses a similar fraction in the same storm but recovers within a few years. Which threat to small populations does this contrast illustrate?", "c": ["Inbreeding depression, because the ten island survivors are now forced to mate with close relatives", "A stochastic event: a random catastrophe can remove most of a small population that a large one survives", "Habitat loss, because the storm stripped away the vegetation that the island birds depend on", "Reduced effective population size, because the storm killed far more males than females", "Competitive exclusion, because competitors from the mainland can now invade the depleted island"], "correct": 1, "explanation": "Slide 9: random demographic or environmental events such as a natural disaster or extreme weather can have a catastrophic impact on a small population, while a large population might recover. Nothing in the scenario says the survivors are related, that habitat was lost, or that the sex ratio changed; the contrast is about the size of the population hit by a chance event.", "t": 11, "src": "11:9"},
  {"q": "Producing a calorie of beef on pasture cleared from rainforest takes far more land than producing a calorie of grain for people to eat directly. Which principle from the course explains this?", "c": ["Only about 10% of the plant energy cattle eat becomes cattle biomass, so a beef calorie needs about ten times the plant production", "Cattle act as decomposers, returning most of the plant energy they eat to the soil rather than storing it as meat", "Energy is recycled through animals the way nutrients are, so the land needed depends on how quickly the grass regrows", "Pasture grasses have much lower GPP than crop plants because grazing removes their leaves before they can photosynthesize", "Cattle convert plant energy to meat with almost no loss, so the extra land is needed mainly to supply their drinking water"], "correct": 0, "explanation": "Lecture 7 (Lindeman's ~10% trophic efficiency) and Lecture 9 (about 90% of energy is lost as heat at each trophic transfer; energy flows one way and is not recycled): adding a trophic level between plants and people means roughly ten times the plant production, and therefore more land, per calorie. Lecture 9 slide 43 notes make the same point about eating lower on the food chain, and Lecture 11 identifies habitat loss, including deforestation, as the leading driver of biodiversity loss.", "t": 0, "src": "07:trophic efficiency; 09:8-10, 43; 11:14"},
  {"q": "Thawing permafrost releases methane, and warming lets shrubs and boreal trees spread into former tundra. Which statement correctly describes how these changes interact?", "c": ["Methane is a greenhouse gas, so its release adds to warming, which thaws more permafrost and pushes the tundra boundary farther poleward", "Methane absorbs carbon dioxide from the air, so its release slows warming and holds the tundra boundary where it is", "The invading shrubs take up more carbon than the thaw releases, so the tundra remains a carbon sink and the boundary holds still", "Permafrost thaw cools the soil by releasing stored ice water, which pushes the tundra boundary back toward the equator", "Methane from permafrost is quickly converted to nitrate by soil microbes, so the main effect is on the nitrogen cycle, not climate"], "correct": 0, "explanation": "Lecture 2 (slide 'Methane'; LO list of greenhouse gases): methane is a greenhouse gas. Lecture 3 (tundra slide notes): permafrost is a massive carbon store, and with global warming the tundra, which used to be a sink, is now a source of carbon and methane. Lecture 10: carbon moved into the atmosphere raises greenhouse-gas levels and warming. The release therefore reinforces the warming that caused it, and the stem states that warming lets shrubs and trees spread into former tundra, so the tundra boundary moves poleward. The options claiming methane absorbs CO₂, that thaw cools the soil, or that methane becomes nitrate misdescribe methane or permafrost; the shrub-sink option contradicts the Lecture 3 point that the tundra is now a carbon source.", "t": 0},
  {"q": "A lake receives heavy phosphorus runoff. Algae bloom, the zooplankton that eat algae multiply, and the fish that eat zooplankton increase. Later, decomposition of the dead algae depletes oxygen and the fish die. Which statement correctly labels two of these steps?", "c": ["The rise of zooplankton and fish after the bloom is bottom-up control; the fish kill is the result of eutrophication-driven hypoxia", "The rise of zooplankton and fish after the bloom is top-down control; the fish kill is the result of phosphorus poisoning the fish", "The algal bloom is a trophic cascade started by the fish; the fish kill is the result of competition among fish for oxygen", "The rise of zooplankton after the bloom is the insurance effect; the fish kill is the result of the phosphorus being used up", "The algal bloom is top-down control exerted by the fish; the fish kill is the result of the algae releasing nitrogen gas"], "correct": 0, "explanation": "Lecture 7: bottom-up control means the supply of energy and nutrients to producers sets the abundance of higher trophic levels, which is what the phosphorus-driven chain from algae to zooplankton to fish shows. Lecture 9: eutrophication kills fish not through toxicity but because the algae and the decomposers processing their dead bodies use up dissolved oxygen (dead zones).", "t": 0},
  {"q": "A seed-eating finch species colonizes an island already occupied by a resident finch that eats seeds of the same size. Over the following decades both species persist, but the resident's beaks have become noticeably larger and it now takes larger seeds. Which combination of concepts explains this outcome?", "c": ["Interspecific competition for a shared resource drove resource partitioning via natural selection, allowing coexistence rather than exclusion", "Mutualism between the two species raised the island's carrying capacity, so both grew in number without affecting one another", "Genetic drift in the small island population randomly shifted beak size, and competition between the species played no part", "The resident was pushed into sink status by predation from the newcomer, and only immigration from the mainland keeps it on the island", "Competitive exclusion removed the resident species entirely, and the newcomer's descendants then evolved the larger beaks"], "correct": 0, "explanation": "Lecture 6: two species cannot coexist indefinitely on the same limiting resource (competitive exclusion principle), but interspecific competition can act as a selective pressure that shifts traits so the species use different resources, as with Galápagos finches on islands with carpenter bees: resource partitioning driven by natural selection. Lecture 8: the newcomer's arrival is immigration, one side of the island species balance.", "t": 0, "src": "06:33-37; 08:island biogeography (immigration)"},
  {"q": "Everglades restoration must deal with agricultural phosphorus runoff, invasive Burmese pythons, and highways that isolate Florida panther populations. Which statement correctly links one proposed action to the ecological problem it addresses?", "c": ["Wildlife underpasses let panthers move between patches, restoring the gene flow that counters drift and inbreeding in small isolated populations", "Wetlands built to treat farm runoff add phosphorus to the water, correcting the phosphorus shortage that limits sawgrass growth downstream", "Pythons are a native top predator, so removing them would weaken the top-down control that keeps Everglades prey populations in check", "Wildlife underpasses stop panthers from dispersing, which keeps each subpopulation's alleles from being diluted by outsiders", "Wetlands built to treat farm runoff remove phosphorus, which matters because phosphorus is directly toxic to fish and wading birds"], "correct": 0, "explanation": "Lecture 11: small, isolated populations lose alleles by drift and suffer inbreeding depression (the Florida panther case), and corridors or crossings reconnect them so immigrants bring alleles in (Lecture 8). Phosphorus runoff is a problem of excess, not shortage, and harms through eutrophication rather than toxicity (Lectures 9-10). Burmese pythons are an introduced species, one of the five drivers of biodiversity loss, not a native predator.", "t": 0, "src": "08:corridors; 09:50; 10:4-9; 11:7-9, 14, 37-42"},
  {"q": "Which of the following best describes an ecosystem?", "c": ["A group of organisms of the same species in one location", "The ocean only", "All organisms on Earth", "A type of forest biome", "Communities plus their abiotic physical and chemical environment"], "correct": 4, "explanation": "An ecosystem includes both biotic (living) and abiotic (non-living) components interacting together.", "t": 1},
  {"q": "In a forest, owls kill a larger fraction of the mice when mice are abundant and a smaller fraction when mice are scarce, and the two populations rise and fall in linked cycles. The owls' effect on the mouse population is best classified as:", "c": ["Predation, a biotic density-dependent factor", "Predation, an abiotic density-independent factor", "Drought, a density-independent factor", "Intraspecific competition among the mice for food", "Mutualism between owls and mice"], "correct": 0, "explanation": "Predation is a biotic factor, and slides 35-38 note that biotic factors usually act in a density-dependent way: the per capita death rate of mice changes with mouse density, which is exactly what 'a larger fraction killed when abundant' describes. Abiotic factors such as drought act regardless of density.", "t": 5, "src": "05:33-38"},
  {"q": "Which combination of abiotic factors is MOST important in determining the type of vegetation that grows in a region?", "c": ["Temperature and precipitation patterns", "Presence of herbivores and predators", "pH of the water", "Soil color", "Number of decomposers"], "correct": 0, "explanation": "Lecture 03 (slides 7, 12): temperature and precipitation are the key drivers of which vegetation, and therefore which biome, occurs in a region. Herbivores and predators are biotic factors; soil color and the number of decomposers are not primary drivers of vegetation type.", "t": 3},
  {"q": "In the tropics, surface winds (the trade winds) blow consistently from east to west. According to lecture, this direction is primarily caused by:", "c": ["Earth's rotation (the Coriolis effect) deflecting surface air as it flows toward the equator", "Earth's 23.5° axial tilt, which changes the angle of sunlight through the year", "Ocean gyres dragging the overlying air westward", "Greenhouse gases absorbing infrared radiation near the equator", "Mountain ranges deflecting winds toward the west"], "correct": 0, "explanation": "Surface air returning toward the equator in each Hadley cell is deflected by Earth's rotation (right in the Northern Hemisphere, left in the Southern), so it arrives from the east. Tilt causes seasons, not wind direction, and winds drive gyres rather than the reverse.", "t": 2},
  {"q": "Two towns sit at the same latitude. Town A is on the coast; Town B is 500 km inland in the interior of a continent, far from any large body of water. Which statement is MOST consistent with the lecture on regional climate?", "c": ["Town B has hotter summers and colder winters than Town A, because land heats and cools faster than water", "Town A has hotter summers and colder winters, because the ocean amplifies temperature swings", "Both towns have the same temperature range, because latitude alone determines climate", "Town B is milder, because inland air is denser", "Town A is milder only because the Coriolis effect is weaker at the coast"], "correct": 0, "explanation": "Land has a lower heat capacity than water, so landmasses heat and cool faster; nearby oceans moderate temperature and rainfall, which is why coastal sites have smaller temperature swings.", "t": 2},
  {"q": "Alpine tundra on high mountains in Colorado is classified as the same biome as arctic tundra in northern Alaska, even though the two are thousands of kilometers apart. According to how lecture defined a biome, this classification is based on the two areas sharing:", "c": ["The same latitude and the same distance from the ocean", "The same dominant plant forms and the same physical conditions", "The same species of plants and animals, spread by dispersal", "The same soil type and the same frequency of fire", "The same position beneath the rising limb of a Hadley cell"], "correct": 1, "explanation": "A biome is defined by its dominant plant forms (trees vs. shrubs vs. grasses, deciduous vs. evergreen) and its physical environment, not by where it sits on the map (Lecture 03 slide 4 notes; LO 1). Arctic, Antarctic and alpine tundra all have severe cold, a very short growing season and low-lying lichens, mosses and cushion plants with almost no trees (slides 30-31). Similar forms in distant places arise by convergent evolution in unrelated species, so the species themselves need not match (slide 5).", "t": 3},
  {"q": "Which biome would you expect to have the LOWEST annual rainfall?", "c": ["Temperate deciduous forest", "Grassland", "Desert", "Boreal forest", "Tropical savanna"], "correct": 2, "explanation": "Deserts are defined by low, sporadic precipitation (slide 25) and sit under the descending dry air of the Hadley cells near 30° N and S (slide 24).", "t": 3},
  {"q": "A scientist studies a terrestrial biome with moderate rainfall (50-150 cm/year), cold winters, and deciduous trees. Which biome is this MOST likely?", "c": ["Temperate rainforest", "Tropical dry forest", "Temperate deciduous forest", "Savanna", "Taiga"], "correct": 2, "explanation": "Moderate rainfall and cold winters characterize temperate deciduous forests (tree leaves fall in winter).", "t": 3},
  {"q": "In June it is summer in Gainesville (29.6° N) but winter in Buenos Aires (34.6° S). According to lecture, what causes this difference between the hemispheres?", "c": ["Earth is closest to the Sun in June, and the Northern Hemisphere is nearer to it than the Southern", "Earth's tilt points the Northern Hemisphere toward the Sun in June, so it receives more direct sunlight", "The ITCZ shifts into the Southern Hemisphere in June and blocks sunlight from reaching the surface there", "The Coriolis effect steers warm tropical air into the Northern Hemisphere during June", "Earth spins faster in June, which lengthens the days in the Northern Hemisphere"], "correct": 1, "explanation": "Lecture 02 slide 8 notes: seasonality exists because Earth's axis is tilted (23.5°) relative to the plane of its orbit, so different latitudes receive different solar energy input at different times of year. Around the June solstice the Sun is overhead at the Tropic of Cancer and the Northern Hemisphere gets more direct sunlight; six months later the Tropic of Capricorn does. Distance from the Sun, the ITCZ and the Coriolis effect do not cause the seasons.", "t": 2},
  {"q": "Population A of groundhogs has 100 births among 1,000 individuals in a year; Population B has 30 births among 200 individuals. Using the per capita birth rate (b) as defined in lecture, which population has the higher b?", "c": ["Population A, because 100 births is more than 30 births", "Population A, because larger populations have higher per capita rates", "Population B, because 30/200 = 0.15 is higher than 100/1,000 = 0.10", "They are equal, because each population has 10 births per 100 individuals", "It cannot be determined without knowing the death rate in each population"], "correct": 2, "explanation": "Lecture 04 slides 53-55: the per capita birth rate is the average number of offspring produced per individual, b = B/N. For A, b = 100/1,000 = 0.10; for B, b = 30/200 = 0.15, so B has the higher per capita birth rate even though A has more total births. Death rates enter r = b - d, not b itself.", "t": 4},
  {"q": "A few individuals colonize an island with abundant resources. Over the following years, which growth pattern would you predict?", "c": ["Rapid J-shaped growth at first, then an S-shaped leveling off near K", "A fixed number of individuals added every year (straight-line growth)", "Steady decline from the start", "No growth until the population reaches carrying capacity", "Random fluctuation with no pattern"], "correct": 0, "explanation": "With resources not yet limiting, growth is near-exponential (J-shaped); as N approaches K the (K-N)/K term shrinks and the curve bends into the logistic S-shape (slides 18-22). Growth is multiplicative, not a fixed number per year.", "t": 5, "src": "05:11-22"},
  {"q": "Which of the following is an example of a density-dependent factor?", "c": ["Food shortage as the population grows", "A volcanic eruption that buries the habitat", "A hurricane that floods nesting sites", "An unusually cold winter", "Increased UV radiation from ozone loss"], "correct": 0, "explanation": "Food availability is density-dependent: the more individuals there are, the less food per capita, so its effect intensifies with density (slide 34 notes). Eruptions, hurricanes, cold spells and UV are abiotic and act regardless of how many individuals are present (slides 38-40).", "t": 5, "src": "05:34-40"},
  {"q": "A bird species experiences reduced nesting success at very low population densities due to difficulty finding mates. This is an example of:", "c": ["Logistic growth", "Intraspecific competition", "Carrying capacity", "Allee effect", "Predation pressure"], "correct": 3, "explanation": "The Allee effect: positive density dependence at low population sizes where cooperation or mate-finding is difficult.", "t": 5},
  {"q": "If a population has r_max = 0.2 and K = 1000, at what population size is the rate of population growth (dN/dt) GREATEST?", "c": ["100", "250", "500", "750", "1000"], "correct": 2, "explanation": "In logistic growth, growth rate is highest at K/2 (half carrying capacity): dN/dt = r_max × N × (K−N)/K is maximized when N = K/2.", "t": 5},
  {"q": "Two beetle species coexist in the same forest but one feeds on oak leaves and the other on pine needles. This is an example of:", "c": ["Competitive exclusion", "Mutualism", "Predation", "Parasitism", "Resource partitioning"], "correct": 4, "explanation": "By using different resources (different plants), the two species reduce competition and partition niche space.", "t": 6},
  {"q": "In the laboratory, blue crabs survive at any salinity from 0 to 35 ppt. In a real estuary, where predators and competitors are present, they are found only in water of 5–25 ppt. According to lecture, the 5–25 ppt range represents the crab's:", "c": ["Realized niche — the niche actually occupied in the presence of biotic interactions", "Fundamental niche — the full range of conditions the species can tolerate", "Carrying capacity in the estuary", "Resource partitioning with other crab species", "Competitive exclusion of the crab from the estuary"], "correct": 0, "explanation": "Lecture 06 (slide 23): the fundamental niche is the niche in the absence of biotic interactions (here 0–35 ppt, measured in the lab); the realized niche is the narrower range actually used once competition and predation are present (5–25 ppt). The realized niche is always contained within the fundamental niche.", "t": 6},
  {"q": "On a savanna, zebra eat grass and eland browse shrubs, so they never compete for food. After a wet decade the zebra herd triples and the lion population grows with it. The eland population then declines. The negative effect of zebra on eland is BEST described as:", "c": ["Apparent competition, mediated by the shared predator", "Exploitation competition for grass", "Interference competition over territory", "A direct effect of zebra on eland", "Bottom-up control of eland by shrub availability"], "correct": 0, "explanation": "Slides 37-38: zebra and eland do not share a resource; the abundant zebra support more lions, and the larger lion population puts more predation pressure on eland. Two prey harming each other through a shared predator is apparent competition, an indirect effect that can look like competition.", "t": 7},
  {"q": "Which community would have the HIGHEST species diversity?", "c": ["20 species, each making up 5% of the individuals", "10 species, with one species making up 80% of the individuals", "5 species, each making up 20% of the individuals", "15 species, with one species making up 85% of the individuals", "30 species, with one species making up 90% of the individuals"], "correct": 0, "explanation": "Diversity combines richness and evenness; 20 equally abundant species is both rich and perfectly even (Shannon H' = ln 20 ≈ 3.0). The 30-species community has more richness but such low evenness that H' ≈ 0.66; the 10-, 15- and 5-species options score ≈0.94, ≈0.82 and ≈1.61.", "t": 6},
  {"q": "In the food chain grass → grasshopper → sparrow → snake → hawk, which organism is the secondary consumer?", "c": ["Sparrow", "Grasshopper", "Grass", "Snake", "Hawk"], "correct": 0, "explanation": "Grass is the producer, the grasshopper (herbivore) is the primary consumer, the sparrow that eats the grasshopper is the secondary consumer, the snake is the tertiary consumer and the hawk the quaternary consumer (slides 3-5). Each link up the chain is one trophic level.", "t": 7, "src": "07:3-5"},
  {"q": "In the chain grass → cricket → lizard → snake, the snakes (tertiary consumers) store 5 kcal of energy in their tissue. If about 10% of the energy at one trophic level is transferred to the next at each step, approximately how much energy did the grass store?", "c": ["50 kcal", "500 kcal", "5,000 kcal", "50,000 kcal", "500,000 kcal"], "correct": 2, "explanation": "Work backwards one transfer at a time: snake 5 kcal ← lizard 50 kcal ← cricket 500 kcal ← grass 5,000 kcal. Three transfers at 10% each mean the tertiary consumer holds 0.1% of the producer energy (slide 25). 500 kcal is what you get if you count only two steps.", "t": 7, "src": "07:25, 07:28-30"},
  {"q": "Atlantic cod, a predator of smaller fish, were overfished to collapse in the early 1990s. Which change in the rest of the food web does the lecture predict, and what kind of control does it illustrate?", "c": ["Small fish increase because their predator is gone; top-down control", "Small fish decrease because cod were their main food; bottom-up control", "Small fish are unaffected because cod only compete with them; interference competition", "Capelin decline because fewer cod means less nutrient cycling; bottom-up control", "Algae decline because small fish eat more of it; apparent competition"], "correct": 0, "explanation": "Slide 11: cod prey on smaller fish, so removing the predator releases the small fish, \"a major imbalance in the food chain.\" A predator setting the abundance of the level below it is top-down (predator-limited) control.", "t": 7},
  {"q": "In MacArthur and Wilson's model, which change would move an island's equilibrium species richness (Ŝ) to a HIGHER value?", "c": ["Lowering the extinction curve, as happens on a larger island", "Lowering the immigration curve, as happens on a more distant island", "Raising the extinction curve, as happens on a smaller island", "Reducing the number of species in the mainland source pool", "Raising the extinction curve and lowering the immigration curve together"], "correct": 0, "explanation": "Ŝ is where the falling immigration curve crosses the rising extinction curve (slide 33). Larger islands have lower extinction rates (bigger populations, less intense competition; slide 32), which pushes the crossing point to the right, a higher Ŝ. Distance moves the immigration curve: far islands have lower immigration and lower Ŝ (slides 36-39). A smaller source pool or both curves moving the wrong way lowers Ŝ.", "t": 8, "src": "08:32-39"},
  {"q": "A 100-hectare tropical forest fragment is surrounded by cattle pasture. Which management action would island biogeography predict to raise the fragment's equilibrium species richness the MOST?", "c": ["Reforest pasture to enlarge the fragment and link it to intact forest", "Cull the fragment's largest predators so that herbivores can increase", "Clear a wide firebreak around the fragment to protect it from fire", "Divide the fragment into several smaller reserves with separate managers", "Remove the dominant tree species to reduce competition inside the fragment"], "correct": 0, "explanation": "A small, isolated fragment behaves like a small, far island: high extinction, low immigration (slides 35-39, 46). The two levers in the model are area and isolation, so enlarging the patch lowers its extinction curve and linking it to intact forest raises its immigration curve, as in the Golden Lion Tamarin corridor (slide 47). Subdividing or further isolating the patch does the opposite.", "t": 8, "src": "08:35-39, 08:46-47"},
  {"q": "A researcher argues that the tropics have more species because higher temperatures raise mutation rates, shorten generation times, and speed up physiological processes, so new species form faster there. Which hypothesis for the latitudinal diversity gradient is this?", "c": ["Evolutionary rate hypothesis", "Species-energy hypothesis", "Geographic area hypothesis", "Historical perturbation hypothesis", "Rescue effect hypothesis"], "correct": 0, "explanation": "Slide 15: the evolutionary rate hypothesis says higher temperatures mean higher mutation rates, shorter generations and faster physiology, so the speciation \"faucet\" is turned up in the tropics. Species-energy is about productivity supporting more individuals, geographic area is about a bigger \"bucket\", and historical perturbation is about time since glaciation.", "t": 8},
  {"q": "Gross Primary Productivity (GPP) minus plant respiration equals:", "c": ["Net Primary Productivity (NPP)", "Trophic efficiency", "Carrying capacity", "Standing crop", "Ecosystem services"], "correct": 0, "explanation": "NPP = GPP − Respiration; NPP is the energy available to consumers after plants use some for their own maintenance.", "t": 9},
  {"q": "In a pond, phytoplankton produce about 500 g C/m² per year, yet their standing crop at any moment never exceeds 5 g C/m². A nearby pine plantation produces 400 g C/m² per year and holds about 15,000 g C/m² of living biomass. Which statement correctly interprets these numbers?", "c": ["The pond has lower NPP than the plantation, because an ecosystem's NPP is set by the biomass it holds at one time", "NPP is a rate of new production while standing crop is a snapshot; rapid consumption keeps phytoplankton biomass low despite high NPP", "The plantation must have higher GPP than the pond, because GPP can be read directly from the amount of standing biomass", "Phytoplankton respire more than they photosynthesize, so the pond's NPP must actually be a negative number", "Aquatic and terrestrial NPP are measured in different units, so the pond and plantation numbers cannot be compared"], "correct": 1, "explanation": "Slide 09:19 notes: NPP is a rate (new biomass per area per time), different from standing crop; slide 09:21: higher productivity does not mean more biomass. Both ecosystems are reported in the same units (g C/m² per year for NPP, g C/m² for standing crop), so they can be compared: the pond has the higher NPP. Phytoplankton are eaten and turn over quickly, so little biomass accumulates; tree biomass accumulates because little of it leaves.", "t": 9},

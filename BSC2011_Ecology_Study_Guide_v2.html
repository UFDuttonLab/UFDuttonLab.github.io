  {"q": "A drought lowers the carrying capacity of a deer herd from 1,000 to 600, but the herd still has N = 800 and r_max = 0.2. According to the logistic model, what happens next?", "c": ["dN/dt = +160 per time step: growth is exponential", "dN/dt = 0: the population is already at carrying capacity", "dN/dt = −160 per time step: every individual above the old K dies", "dN/dt ≈ +53 per time step: the population keeps growing toward the new K", "dN/dt ≈ −53 per time step: the population shrinks because (K − N)/K is negative when N > K"], "correct": 4, "explanation": "dN/dt = 0.2 × 800 × (600 − 800)/600 = 0.2 × 800 × (−0.333) ≈ −53. When N exceeds K the growth-rate modifier is negative, so the population declines toward the new carrying capacity.", "t": 5, "src": "05:18-21"},
  {"q": "A population grows logistically with K = 1,000. At which population size is the PER CAPITA growth rate (r) closest to r_max?", "c": ["N = 500", "N = 250", "N = 1,000", "N = 10", "N = 750"], "correct": 3, "explanation": "In logistic growth r = r_max × (1 − N/K), so r is closest to r_max when N is tiny and resources are effectively unlimited. Do not confuse this with the population growth rate dN/dt, which peaks at N = K/2 = 500.", "t": 5, "src": "05:12, 05:22-24"},
  {"q": "Two populations are monitored as they grow. In Population A the per capita growth rate stays the same no matter how large N becomes. In Population B the per capita growth rate falls steadily as N increases. Which growth model best describes each population?", "c": ["Both are logistic", "Both are exponential", "A is exponential; B is logistic", "A is at carrying capacity; B is exponential", "A is logistic; B is exponential"], "correct": 2, "explanation": "A constant per capita growth rate (r = r_max regardless of N) is the hallmark of exponential growth; a per capita rate that declines as N approaches K is the hallmark of logistic growth and produces the S-shaped curve.", "t": 5, "src": "05:22-23"},
  {"q": "A population following logistic growth is currently at one quarter of its carrying capacity (N = K/4). Its actual per capita growth rate is what fraction of r_max?", "c": ["Exactly r_max", "0.75 of r_max", "0 (growth has stopped)", "0.25 of r_max", "4 times r_max"], "correct": 1, "explanation": "The actual per capita rate is r = r_max × (K − N)/K = r_max × (1 − N/K). With N = K/4, (1 − 0.25) = 0.75, so individuals are reproducing at three quarters of their maximum rate.", "t": 5, "src": "05:20-23"},
  {"q": "A late frost kills 40% of oak seedlings in both a sparse stand and a dense stand. Later that summer a fungal disease kills a much larger fraction of seedlings in the dense stand than in the sparse stand. How should the two mortality sources be classified?", "c": ["Frost is an Allee effect; the fungal disease is density-independent", "Frost is density-independent; the fungal disease is density-dependent", "Both are density-dependent", "Frost is density-dependent; the fungal disease is density-independent", "Both are density-independent"], "correct": 1, "explanation": "The frost removed the same proportion regardless of density, which defines a density-independent (abiotic) factor. The disease had a stronger effect in the crowded stand, which defines a density-dependent (biotic) factor.", "t": 5, "src": "05:34, 05:38-40"},
  {"q": "Biologists record fawn survival in a deer population at different densities: at 5 deer/km² 80% of fawns survive their first year; at 15 deer/km² 60% survive; at 30 deer/km² 35% survive; at 50 deer/km² 15% survive. Which of the three ways that density dependence can regulate a population do these data illustrate?", "c": ["Density-independent mortality: the same fraction of fawns dies at every density", "Higher fawn survival at high density than at low density (an Allee effect)", "A rising per capita death rate as density increases (negative density dependence)", "Exponential growth with a constant per capita rate r at every density", "A falling per capita birth rate as density increases (negative density dependence)"], "correct": 2, "explanation": "Fawn mortality rises steadily with density, so this is negative density dependence acting through the death rate. Density dependence can regulate populations by lowering per capita birth rates, raising per capita death rates, or both.", "t": 5, "src": "05:34-38"},
  {"q": "Which list contains ONLY factors that lecture classified as abiotic regulators of population size, which typically act in a density-independent manner?", "c": ["Fire, flood, hurricane, drought", "Drought, parasitism, fire, predation", "Parasitism, competition, predation, disease", "Competition, flood, hurricane, disease", "Predation, disease, drought, fire"], "correct": 0, "explanation": "Lecture grouped fire, flood, hurricane and drought as abiotic factors that affect a population regardless of its density, whereas parasitism, disease, predation and competition are biotic factors that usually act in a density-dependent way.", "t": 5, "src": "05:33, 05:38"},
  {"q": "A 30-year census of a moose population shows the herd repeatedly rising above and falling below roughly 1,200 animals without ever settling at one number. What is the best interpretation?", "c": ["Regulation only by density-independent factors, since the herd never settles at one size", "Absence of any carrying capacity, since the herd never stays at a fixed number", "The exponential phase of growth, since the herd keeps rising above 1,200", "An r_max of zero, since the long-term average size does not change", "Fluctuation around a carrying capacity of about 1,200, which is typical of natural populations"], "correct": 4, "explanation": "Fluctuations and cycles are the rule for natural populations: they hover around K rather than sitting exactly at it. Varying around 1,200 is what a regulated population near K looks like.", "t": 5, "src": "05:41"},
  {"q": "The global fertility rate has fallen from about 5 children per woman in the 1960s to about 2.5 today. If it continues to fall to replacement level (about 2 children per woman) and stays there, what does lecture predict for the human population?", "c": ["It would immediately begin to shrink", "Its doubling time would become shorter", "It would keep growing exponentially", "Death rates would have to exceed birth rates", "It would eventually stop growing and stabilize"], "correct": 4, "explanation": "A fertility rate of ~2 (with equal sex ratios) means each generation just replaces itself, so births equal deaths and r approaches 0; many projections expect stabilization near 9–10 billion if that happens. Momentum keeps the population growing for a while first, so it does not shrink immediately.", "t": 5, "src": "05:47-48, 05:56"},
  {"q": "The world's population growth rate peaked at about 2.2% per year in the 1960s and is now about 1% per year, yet the population still increases by tens of millions of people each year. Why?", "c": ["r is still positive, and 1% of a very large N still adds a very large number of people", "r has become negative, yet the total still increases because N is so large", "Immigration into Earth's population now exceeds emigration from it", "Birth rates are now rising faster than death rates worldwide", "Earth's carrying capacity has fallen, so the population is overshooting it"], "correct": 0, "explanation": "Population change is r × N. A smaller but still positive r applied to an enormous N still adds tens of millions of people a year; the total will keep rising until r reaches zero (births = deaths), as the LO self-assessment explains.", "t": 5, "src": "05:43-46"},
  {"q": "Which statement about Earth's carrying capacity for humans matches what was presented in lecture?", "c": ["The population is expected to stabilize at about 2 billion once fertility falls", "A common estimate is 20 billion, so we are still far below carrying capacity", "A common estimate is 9–10 billion, and many ecologists think we have already overshot it", "Technological advances have steadily lowered the human carrying capacity over time", "Human population growth has already stopped, showing that we have reached K"], "correct": 2, "explanation": "Slide 56: some think Earth's maximum carrying capacity is 9–10 billion, and many ecologists believe we have already overshot it, because fertilizers, pesticides, irrigation and food transport all rely on fossil fuels; climate change and ecosystem degradation could lower K further. If fertility falls to replacement level, some predict the population will stabilize near 9–10 billion, not 2 billion (slide 56 notes). Technology has raised K over time, not lowered it (slide 42 notes), and the population is still increasing even though the growth rate is falling (slide 44).", "t": 5, "src": "05:56"},
  {"q": "Survivorship curves for people born in England and Wales in the mid-1800s and for people born recently show that fewer than half of the 1800s cohort survived to age 50, whereas about 97% of the recent cohort is expected to. Which statement best describes this change?", "c": ["Human survivorship has shifted from a Type I curve to a Type III curve", "Humans show a Type I curve that has become more pronounced as both child and old-age mortality fell", "Survival improved only among the very old; child mortality was unchanged over this period", "The change reflects a lower birth rate rather than any change in death rates", "Human survivorship is now Type II, with constant mortality at every age"], "correct": 1, "explanation": "Humans have a Type I curve (high survival until old age). Over 150 years the curve flattened further at young ages because child mortality dropped, and it extended at old ages because older people now survive longer.", "t": 5, "src": "05:50-51"},
  {"q": "Which research project is best described as community ecology, as defined in lecture?", "c": ["Measuring how the abundances of five coexisting fish species change when one is removed", "Measuring the rate at which nitrogen cycles through a forest's soil and vegetation", "Mapping global patterns of temperature and precipitation across the continents", "Describing the life-history trade-offs of one salmon species over its lifetime", "Estimating the size of a single turtle population using mark–recapture"], "correct": 0, "explanation": "Community ecology is the study of the distribution and abundance of populations of coexisting species and their interactions. A single population is population ecology; nutrient cycling is ecosystem ecology; climate maps are physical geography.", "t": 6, "src": "06:3, 06:9"},
  {"q": "Which of the following is an ecological community as defined in lecture?", "c": ["The shore's organisms together with its tides, temperatures and rock substrate", "The physical conditions of the shore only", "All the rocky shores on Earth", "All the populations of plants, animals and microbes interacting on a rocky intertidal shore", "All the barnacles of one species living on that shore"], "correct": 3, "explanation": "A community is a group of populations of different species living close enough to interact. Adding the physical environment makes it an ecosystem; a single species is a population.", "t": 6, "src": "06:7-8"},
  {"q": "Cattle egrets follow grazing cattle and eat insects the cattle flush out of the grass; the cattle are unaffected. The same cattle trample grass, harming it, with no benefit or harm to the cattle. In lecture's +/−/0 framework these two interactions are, respectively:", "c": ["Commensalism (+/0) and predation (+/−)", "Commensalism (+/0) and amensalism (−/0)", "Mutualism (+/+) and amensalism (−/0)", "Amensalism (−/0) and commensalism (+/0)", "Mutualism (+/+) and competition (−/−)"], "correct": 1, "explanation": "Birds that forage around large herbivores benefit while the herbivore is unaffected (commensalism, +/0). Cattle trampling grass was lecture's example of amensalism: the grass is harmed and the cattle neither gain nor lose (−/0).", "t": 6, "src": "06:10"},
  {"q": "A graph plots the per capita growth rate of species B against the density of species A: B's growth rate rises as A becomes more abundant. A second graph shows that A's per capita growth rate is unchanged at any density of B. What interaction is this?", "c": ["Competition", "Amensalism", "Predation", "Commensalism", "Mutualism"], "correct": 3, "explanation": "The signs in the interaction table refer to each species' effect on the other's per capita growth rate. B benefits (+) and A is unaffected (0), which is commensalism; mutualism would require both to rise and amensalism would require B to be harmed.", "t": 6, "src": "06:10-11"},
  {"q": "According to lecture, competition is best defined as:", "c": ["An interaction between individuals of different species that share a habitat", "Use or defense of a limiting resource that reduces its availability to others", "Any interaction in which one species benefits and the other species is harmed (+/−)", "Direct physical fighting between individuals over food, mates or territory", "The consumption of all or part of one living organism by another organism"], "correct": 1, "explanation": "Competition is defined by its effect on a limiting resource, not by fighting, and it can be intraspecific (within a species) or interspecific (between species). A +/− interaction is predation, parasitism or herbivory, not competition.", "t": 6, "src": "06:13"},
  {"q": "As a stand of oak seedlings of a single species becomes denser, each seedling receives less light and water and the population's per capita growth rate falls. This decline in r is caused by:", "c": ["Commensalism", "Interspecific competition", "Predation", "Amensalism", "Intraspecific competition"], "correct": 4, "explanation": "Competition among individuals of the same species for limiting resources is intraspecific competition; it is the mechanism that makes r decline as N approaches K in logistic growth. Interspecific competition would involve a second species.", "t": 6, "src": "06:13, 06:16"},
  {"q": "Nest cavities in dead trees are scarce in a forest, and woodpecker pairs that fail to secure a cavity do not breed, so population growth depends on how many cavities exist. In lecture's terms, nest cavities are:", "c": ["An Allee effect", "The woodpecker's realized niche", "An abiotic condition rather than a resource", "A limiting resource (space) over which individuals compete", "A density-independent factor"], "correct": 3, "explanation": "A limiting resource is any factor used by an organism that affects population growth rate; lecture listed food, water, nutrients and space. Cavities are a form of space that is used up, so they are a limiting resource and a basis for competition.", "t": 6, "src": "06:13-14"},
  {"q": "Gause grew Paramecium aurelia and Paramecium caudatum on the same bacterial food. Alone, each species grew logistically to its own carrying capacity. Together, P. caudatum declined to extinction within about two weeks while P. aurelia reached nearly its usual density. Which conclusion do these data support?", "c": ["P. aurelia preyed on P. caudatum once the bacterial food ran short", "One limiting resource was shared, and the better competitor excluded the other", "P. caudatum's decline was caused by a density-independent factor in the flask", "The two species partitioned the bacterial food and coexisted at lower densities", "The two species formed a mutualism that collapsed when food ran out"], "correct": 1, "explanation": "This is the experiment behind Gause's competitive exclusion principle: two species cannot coexist indefinitely on the same limiting resource. When niches are identical, the better competitor eventually eliminates the other.", "t": 6, "src": "06:18-20"},
  {"q": "In a second experiment, Gause grew P. caudatum with P. bursaria. Both species persisted, but each at a lower density than when grown alone. P. bursaria fed on bacteria in the low-oxygen sediment at the bottom of the flask, where P. caudatum cannot survive. Which statement is correct?", "c": ["The species coexisted because they do not compete with each other at all", "This result violates Gause's competitive exclusion principle", "The species coexist because they occupy an identical niche in the flask", "P. bursaria was competitively excluded by P. caudatum from the flask", "Resource partitioning allowed coexistence, but competition still lowered both densities"], "correct": 4, "explanation": "Using different parts of the flask is resource partitioning, which allows coexistence. Competition for the shared bacteria still has a −/− effect, which is why both species level off below their single-species carrying capacities.", "t": 6, "src": "06:25-26"},
  {"q": "In lecture, a species' niche was defined as:", "c": ["Its position in the food chain of its community", "Its requirements for all resources and physical conditions", "The type of habitat in which it is usually found", "The geographic area over which the species is found", "The set of other species with which it interacts"], "correct": 1, "explanation": "A niche is multidimensional: every resource (food, space) and every physical condition (temperature, moisture, light) the species requires is one axis. Habitat, range and trophic position each describe only a part of it.", "t": 6, "src": "06:21-22"},
  {"q": "In Connell's barnacle study, removing Balanus allowed Chthamalus to spread into the lower intertidal. But when Chthamalus was removed from the upper zone, Balanus did NOT spread upward. What is the best explanation for Balanus's result?", "c": ["Predators remove any Balanus that settle in the upper intertidal zone", "Balanus is competitively excluded from the upper zone by Chthamalus", "Balanus's fundamental niche in the upper zone is larger than its realized niche there", "Balanus and Chthamalus are mutualists, so Balanus cannot survive without Chthamalus", "Balanus's upper limit is set by an abiotic factor (desiccation), not by competition"], "correct": 4, "explanation": "The two species are limited by different things: Chthamalus is kept out of the lower zone by competition (biotic), whereas Balanus cannot tolerate drying out in the upper zone (abiotic), as the slide 24 note says: 'biotic control on top, abiotic control on the bottom'. Removing a competitor only expands a species' distribution if competition was what restricted it.", "t": 6, "src": "06:23-24"},
  {"q": "Grown alone in pots, a plant species survives at any soil pH from 4 to 8. In the field it occurs only at pH 4–5.5, the range where a faster-growing competitor is absent. The pH 4–8 range is the plant's ______ niche and pH 4–5.5 is its ______ niche.", "c": ["realized; fundamental", "abiotic; biotic", "intraspecific; interspecific", "fundamental; realized", "habitat; niche"], "correct": 3, "explanation": "The fundamental niche is the full set of conditions a species can use in the absence of biotic interactions; the realized niche is the narrower set it actually occupies once competitors and other species are present.", "t": 6, "src": "06:23"},
  {"q": "Two bat species roost in the same cave and eat the same moths over the same fields, but one hunts in the first two hours after sunset and the other in the two hours before dawn. Both populations have persisted for decades. What best explains their coexistence?", "c": ["Resource partitioning: they use the same prey at different times", "Competitive exclusion: one species is slowly eliminating the other", "Commensalism: one species benefits the other without being affected", "Identical realized niches, which allow stable coexistence", "Interspecific competition that is stronger than intraspecific competition"], "correct": 0, "explanation": "Species that use the same resource in different ways, places or times are partitioning it (slides 25-27). Time of foraging is one axis of the niche, so the two species' realized niches differ, each species limits itself more than it limits the other (intraspecific > interspecific competition, slides 33-34), and both persist. Identical niches would lead to competitive exclusion, not coexistence.", "t": 6, "src": "06:25-27, 06:33-34"},
  {"q": "Species A is the stronger competitor and, left alone, would eventually exclude species B from a grassland. A shared predator preys mainly on species A. What effect does the predator have on the two competitors?", "c": ["It has no effect on the outcome, because the predator is not itself a competitor", "It eliminates species A entirely, leaving species B alone in the grassland", "It speeds up the competitive exclusion of species B from the grassland", "It promotes coexistence by holding species A below the abundance needed to exclude B", "It increases the intensity of competition between A and B for the grass"], "correct": 3, "explanation": "This is predator-mediated coexistence: by preferentially consuming the dominant competitor, the predator relieves pressure on the weaker species. Lecture's example was lions, which take wildebeest more easily than zebra.", "t": 6, "src": "06:28-29"},
  {"q": "In a field experiment, adding 100 individuals of species A to a plot reduces species A's own per capita growth rate by 30% but reduces species B's per capita growth rate by only 10%. Adding 100 individuals of B reduces B's own growth by 30% and A's by only 10%. What does lecture's coexistence rule predict?", "c": ["Competitive exclusion of species A, because B reduces A's growth by 10%", "The two species are not competing at all, because the cross-species effects are small", "Coexistence, but only if a shared predator removes the stronger competitor", "Stable coexistence, because each species limits itself more than it limits the other", "Competitive exclusion of species B, because A reduces B's growth by 10%"], "correct": 3, "explanation": "Two competitors can coexist when intraspecific competition is stronger than interspecific competition. Each species' growth is held back mainly by its own density, so neither can drive the other to extinction.", "t": 6, "src": "06:33-34"},
  {"q": "On an island with a single type of seed of fixed size and hardness, a finch population shows that medium-beaked birds fledge the most offspring: small-beaked birds cannot crack the seeds efficiently and large-beaked birds waste energy maintaining a bigger body. If beak size is heritable, what will intraspecific competition for seeds do over generations?", "c": ["Nothing will change, because competition affects survival but not fitness", "Beak size will converge on the intermediate 'just right' optimum (stabilizing selection)", "Beaks will become larger every generation, because bigger beaks crack seeds faster", "The population will split into a small-beaked species and a large-beaked species", "Beak size will shift to match that of a competing bird species on the island"], "correct": 1, "explanation": "Competition is a selective pressure when individuals vary in heritable traits. With one seed type the 'just right' beak converts seeds into offspring most efficiently, so natural selection stabilizes beak size at that optimum (slide 36), and carrying capacity rises as the efficient birds come to predominate.", "t": 6, "src": "06:35-36"},
  {"q": "Galápagos finches can eat seeds or drink nectar; small-beaked birds are better at nectar, large-beaked birds at seeds. On islands where carpenter bees are present, finches have larger beaks and drink almost no nectar; on islands without bees, finches are smaller and use nectar heavily. What best explains this pattern?", "c": ["Competition with bees for nectar selected for seed-eating finches with larger beaks", "Carpenter bees and finches are commensal (+/0): the bees benefit and the finches are unaffected", "Intraspecific competition among finches is stronger on islands that have bees", "Carpenter bees prey on small finches, removing the small-beaked birds from the population", "Bees pollinate the plants the finches depend on, a mutualism that favors seed production"], "correct": 0, "explanation": "Bees are superior competitors for nectar, so on bee islands selection favors finches that specialize on seeds. The result is resource partitioning between finches and bees that arose through evolution rather than behavior alone.", "t": 6, "src": "06:37"},
  {"q": "Lecture described mutualisms as 'biological markets' in which partners trade commodities. Which pairing correctly states what is exchanged?", "c": ["Clownfish supply carbon to anemones and receive pollination", "Bees supply nectar to flowers and receive transport", "Zooxanthellae supply protection to corals and receive nitrogen", "Corals supply phosphorus to zooxanthellae and receive protection", "Mycorrhizal fungi supply phosphorus to plants and receive carbon"], "correct": 4, "explanation": "In a biological market each partner trades something cheap for it to make for something expensive or impossible for it to obtain: fungi are good at scavenging phosphorus, plants are good at fixing carbon. The commodities traded fall into nutrition, protection and transport.", "t": 6, "src": "06:38-39"},
  {"q": "Community Y has three species with proportions 0.50, 0.25 and 0.25. Using the Shannon index H′ = −Σ pᵢ ln pᵢ from the formula sheet (ln 0.5 ≈ −0.693, ln 0.25 ≈ −1.386), what is H′ for Community Y?", "c": ["About 1.04", "About 1.10", "About 0.69", "About 2.08", "Exactly 3.0"], "correct": 0, "explanation": "H′ = −[0.5 × ln 0.5 + 2 × (0.25 × ln 0.25)] = −[0.5 × (−0.693) + 2 × (0.25 × −1.386)] = 0.347 + 0.693 ≈ 1.04. Three perfectly even species would give ln 3 ≈ 1.10, so the uneven abundances lower diversity below the maximum for that richness. 2.08 is what you get if you forget to weight each ln pᵢ by pᵢ.", "t": 6, "src": "06:41; 08:21-23; formula sheet"},
  {"q": "In community ecology, the term \"trophic structure\" refers to:", "c": ["The pattern of births, deaths, immigration and emigration in a population", "Who eats whom in a community, and how energy and materials move", "The physical layering of vegetation from ground cover to canopy", "The ratio of predators to competitors in a habitat", "The number of species present in a community"], "correct": 1, "explanation": "Slide 4: trophic structure describes who eats whom and the transfer of energy and materials; 'trophic' comes from the Greek for nourishment. Richness, vegetation layers and population dynamics are different concepts.", "t": 7, "src": "07:3-4"},
  {"q": "A diagram shows grass → grasshopper → sparrow → hawk as one line, and a second diagram shows dozens of species in the same Arctic community connected by many crossing arrows. Which statement about these two diagrams is correct?", "c": ["The first is a food web and the second a food chain, because it contains many more species", "Both are food chains; a food web must also show abiotic factors such as sunlight and nutrients", "In both diagrams the arrows point from the eater to the eaten, showing who hunts whom", "The second is an ecological network rather than a food web because it has more than ten species", "The first is a food chain and the second a food web; arrows point from eaten to eater (energy flow)"], "correct": 4, "explanation": "Slides 4-7: a food chain is the linear flow of links, different chains link to form a food web, and arrows show the direction of energy flow (from the organism eaten to the one eating it). Real webs such as the Arctic example are highly interconnected.", "t": 7, "src": "07:4-7"},
  {"q": "A black bear eats berries in summer and salmon in autumn, and fungi break down the bear's carcass when it dies. In trophic terms, the bear and the fungi are, respectively:", "c": ["An omnivore and a decomposer", "A primary consumer and a secondary consumer", "A secondary consumer and an omnivore", "A primary producer and a decomposer", "A tertiary consumer and a primary producer"], "correct": 0, "explanation": "Slide 3 notes: omnivores feed across several trophic levels (plants and animals), and decomposers can feed on dead material from any trophic level. The slide-5 notes raise exactly this problem: where do bears fit in a linear chain? They do not, which is why real communities are webs.", "t": 7, "src": "07:3-5"},
  {"q": "Ecologists survey 40 lakes and plot algal biomass against phosphorus concentration, one dot per lake. Lakes with more phosphorus consistently have more algae, regardless of how many fish they contain. This pattern is evidence of:", "c": ["Top-down control: predators of algae are limiting algal abundance", "A trophic cascade driven by piscivorous fish", "Bottom-up control: nutrient availability for producers sets algal abundance", "Lindeman's 10% rule operating at the producer level", "Apparent competition between algae and phosphorus"], "correct": 2, "explanation": "Slides 16 and 18: when energy or nutrients available to primary producers control their abundance (and in turn the levels above), populations are 'food limited', which is bottom-up control. If predators were setting algal levels, algae would track fish, not phosphorus.", "t": 7, "src": "07:16-18"},
  {"q": "You manage a game reserve and want more zebras. Monitoring shows that zebra numbers rise and fall with grass production each year and that lions kill only a small fraction of the herd. Based on the lecture's framework, the action most likely to increase zebras is:", "c": ["Increase zebra food, because the population appears to be regulated bottom-up", "Introduce eland so that lions switch prey, reducing apparent competition", "Do nothing, because the 10% rule means zebra numbers cannot change", "Add more lions to trigger a trophic cascade that favors grass", "Remove lions, because the population appears to be regulated top-down"], "correct": 0, "explanation": "Slides 12-14 (notes): whether you remove lions or add zebra food 'depends on whether the population of zebras is regulated by top down or bottom up forces.' Zebras tracking grass with little predation mortality indicates bottom-up (food-limited) regulation, so increasing food is the logical lever.", "t": 7, "src": "07:12-17"},
  {"q": "In the four-level lake cascade (piscivorous fish → zooplanktivorous fish → zooplankton → algae), a manager adds piscivores. Which pair correctly identifies one DIRECT effect and one INDIRECT effect of the piscivores?", "c": ["Direct: zooplanktivorous fish decrease; Indirect: algae decrease", "Direct: nutrients decrease; Indirect: piscivores increase", "Direct: algae decrease; Indirect: zooplanktivorous fish decrease", "Direct: zooplanktivorous fish increase; Indirect: zooplankton decrease", "Direct: zooplankton decrease; Indirect: algae increase"], "correct": 0, "explanation": "Slides 21-22: piscivores eat zooplanktivorous fish (a direct predator-prey effect), which releases zooplankton, which then graze algae down. The drop in algae is an indirect effect transmitted through two intermediate levels, which is what makes this a trophic cascade.", "t": 7, "src": "07:20-22"},
  {"q": "In Yellowstone, wolves eat elk, elk browse willows, and beavers need willows for food and dam material. Which of the following is a DIRECT effect?", "c": ["The effect of elk on beaver abundance", "The effect of wolves on beaver abundance", "The effect of wolves on stream temperature", "The effect of elk browsing on willow abundance", "The effect of wolves on willow abundance"], "correct": 3, "explanation": "A direct effect occurs between two species that interact with each other (elk eating willows). Wolves affect willows, beavers and streams only through intermediaries (wolves → elk → willows → beavers/banks), so those are indirect effects of the trophic cascade (slides 22, 40, 47-48).", "t": 7, "src": "07:22,40,45-48"},
  {"q": "Managers introduce rabbits to a grassland where foxes eat native hares. Foxes also eat the rabbits, but rabbits and hares eat different plants. Fox numbers then double and hare numbers fall. Which of the following is a DIRECT effect in this food web?", "c": ["Foxes reducing hare survival by eating hares", "Rabbits reducing hare numbers by supporting more foxes", "Rabbits reducing hare numbers by depleting shared food", "Hares reducing rabbit numbers through the shared predator", "Grass production setting fox numbers through the rabbits"], "correct": 0, "explanation": "A direct effect occurs between two interacting species, here predator and prey (foxes eating hares). The effect of rabbits on hares travels through the foxes: more rabbits feed more foxes, and more foxes eat more hares. That indirect effect between two prey that share a predator is apparent competition (slides 37-38, zebra-eland-lion). Rabbits and hares eat different plants, so there is no shared food to deplete, and the effects of hares on rabbits and of grass on foxes also pass through a third species.", "t": 7, "src": "07:22, 07:37-38"},
  {"q": "Grass in a field stores 20,000 kcal of energy in plant tissue. Energy passes along the chain grass → grasshopper → mouse → snake → hawk, and about 10% of the energy at one trophic level is transferred to the next at each step (Lindeman's efficiency). Approximately how much of the original 20,000 kcal ends up in hawk tissue?", "c": ["2,000 kcal", "200 kcal", "20 kcal", "2 kcal", "0.2 kcal"], "correct": 3, "explanation": "Count the transfers, not the boxes: grass 20,000 → grasshopper 2,000 → mouse 200 → snake 20 → hawk 2 kcal. Four transfers at 10% each leave 0.01% of the producer energy in the quaternary consumer, which is why the lecture's hawk ended up with only 10 kcal of the grass's 1,000,000 (slides 28-30). 20 kcal is the tertiary consumer (snake).", "t": 7, "src": "07:25,28-30"},
  {"q": "Field measurements show that the secondary consumers in a pond (small fish that eat zooplankton) contain about 300 kcal of energy. Assuming the 10% rule at each transfer, approximately how much energy must the pond's producers have stored?", "c": ["3,000 kcal", "30,000 kcal", "300,000 kcal", "3 kcal", "600 kcal"], "correct": 1, "explanation": "Work backwards two transfers: secondary consumers 300 kcal = 10% of primary consumers (3,000 kcal) = 10% of producers (30,000 kcal). Because so little energy survives each step, large producer bases are needed to support even small amounts of consumer biomass (slide 25).", "t": 7, "src": "07:25,28-30"},
  {"q": "After wolves were eliminated from Yellowstone in 1926, beavers nearly disappeared from many streams. According to the lecture, the chain of causes was:", "c": ["Without wolves, beavers were hunted by park rangers to control flooding", "Elk increased → elk browsed willows heavily → willows nearly vanished → beavers lost food and dam material", "Coyotes increased → coyotes preyed directly on beavers → beavers declined", "Wolves had been eating elk carcasses that fertilized willows → without wolves, willows starved", "Elk trampled beaver dams → streams dried → beavers left"], "correct": 1, "explanation": "Slides 47 and 50 notes: without wolves, elk browsed freely, willows and cottonwoods along streams almost disappeared, and beavers, which depend on willows, were lost; stream channels then cut deeper and banks eroded. This is a multi-step indirect effect (wolves → elk → vegetation → beavers).", "t": 7, "src": "07:45-50"},
  {"q": "Between 1926 and 1995, foxes, badgers and raptors declined in Yellowstone. The lecture attributes this to:", "c": ["Elk out-competed foxes and badgers for the riparian vegetation they depend on", "Stream warming killed the fish that foxes, badgers and raptors relied on", "Beavers expanded and flooded the dens of foxes and badgers", "Coyotes increased after wolves vanished and ate more of the small mammals", "Wolves had been protecting foxes and badgers from predation by grizzly bears"], "correct": 3, "explanation": "Slide 47 notes: with less competition from wolves, coyote numbers increased; coyotes eat large numbers of small mammals, so other small-mammal predators (fox, raptors, badgers) declined. When wolves returned, coyotes decreased (slide 48).", "t": 7, "src": "07:47-48"},
  {"q": "A diagram of a savanna community draws each plant and pollinator species as a circle, with a line connecting each plant to every insect species that visits its flowers. Which description of this diagram is correct?", "c": ["A food web: each line is an arrow showing energy flowing from prey to predator", "A food chain: the lines show a linear sequence of who eats whom in the savanna", "A trophic cascade: the lines trace effects passing down through trophic levels", "A biomass pyramid: the circles are drawn in proportion to each species' biomass", "An ecological network: species are nodes and lines are interactions such as pollination"], "correct": 4, "explanation": "Slide 41: ecological networks depict different types of species interactions, not just trophic ones; species are 'nodes' and interactions are lines connecting the nodes. The lecture's example is plant-pollinator networks and how the loss of large herbivores alters them (slides 42-44). A food web's arrows show energy flow from prey to predator (slide 6), a food chain is a single linear sequence (slide 4), a trophic cascade is an effect rippling through trophic levels (slides 21-22), and a biomass pyramid stacks trophic levels by biomass.", "t": 7, "src": "07:41-44"},
  {"q": "A meta-analysis of vegetation restoration projects compared the effect size of several interventions on plant abundance. Predator reintroduction produced large positive effect sizes, while fencing out herbivores produced effects near zero. Which conclusion matches the lecture's interpretation?", "c": ["Herbivores are irrelevant to restoration success, so planting more seedlings is the best strategy", "Fencing works better than predator reintroduction, but the study was too small to show it", "Predators increased vegetation directly by dispersing seeds in their droppings", "Reintroducing predators (restoring top-down control) worked best; excluding herbivores did little", "Restoration fails mainly because of nutrient limitation, a bottom-up problem predators cannot fix"], "correct": 3, "explanation": "Slides 31-34 (notes): many planting-based restorations fail because herbivores such as deer and feral hogs are out of control after top predators were lost; in the study shown, predator reintroduction had the largest positive effect on vegetation, while excluding herbivores 'didn't really have much of an impact.'", "t": 7, "src": "07:31-35"},
  {"q": "A survey counts breeding bird species in equal-sized plots at 5°, 25°, 45° and 65° N and finds 420, 260, 150 and 60 species respectively. This pattern is an example of:", "c": ["The species-area relationship: larger plots contain more species", "The latitudinal diversity gradient: species richness increases toward the equator", "The rescue effect: immigration from the tropics prevents extinction at high latitudes", "An inverted biomass pyramid", "Island biogeography: northern plots are farther from the mainland"], "correct": 1, "explanation": "Slides 3-6: across many groups (birds, mammals, amphibians), richness rises toward the equator and falls toward the poles. The plots are equal in size, so area cannot explain the pattern, and no islands or immigration are involved.", "t": 8, "src": "08:3-6"},
  {"q": "The species-energy hypothesis proposes that high solar energy and water availability (high evapotranspiration) in the tropics increase productivity, which supports more individuals and therefore more species. What critique of this hypothesis did the lecture present?", "c": ["Tropical species are not older on average than temperate species", "Successive biomes north of the tropics have similar areas but very different richness", "Speciation rates in marine fishes are highest at the poles, not in the tropics", "At broad scales, higher species richness is not necessarily linked to more individuals", "The tropics actually receive less solar energy than temperate zones because of cloud cover"], "correct": 3, "explanation": "Slide 11: the hypothesis assumes productivity → more individuals → more species, but studies suggest richness over broad scales is not necessarily linked to the number of individuals, and so not necessarily to productivity. The other critiques belong to the evolutionary-rate, historical-perturbation and geographic-area hypotheses.", "t": 8, "src": "08:10-11"},
  {"q": "The geographic area hypothesis says the tropics are the largest biome, so they hold more species and tropical species have larger ranges and lower extinction risk. The lecture's critique of this hypothesis is that:", "c": ["Successive biomes north of the tropics have similar areas yet differ greatly in richness", "Mutation rates and generation times do not vary with temperature", "Mercator maps prove that the tropics are the smallest biome on Earth", "Glaciation affected the tropics as strongly as it affected high latitudes", "Species with larger geographic ranges are more likely to go extinct"], "correct": 0, "explanation": "Slide 14 notes: even if the tropics are the most extensive biome, the successive biomes to the north have about the same area as each other and should therefore have similar richness, but they do not. Slide 13 also warns that Mercator projections exaggerate high-latitude area, which makes the tropics look smaller than they are, not larger.", "t": 8, "src": "08:13-14"},
  {"q": "A 2018 study of all ray-finned fishes plotted speciation rate against latitude and found that speciation was fastest at polar latitudes, while species richness was still highest in the tropics. This result is most damaging to which hypothesis, and why?", "c": ["Historical perturbation hypothesis, because it predicts that polar species should be older", "Rescue effect, because it predicts that fish immigrate from the poles to the tropics", "Geographic area hypothesis, because it predicts that the polar ocean is the largest biome", "Evolutionary rate hypothesis, because it predicts the fastest speciation where temperatures are highest", "Species-energy hypothesis, because it predicts that polar seas are the most productive"], "correct": 3, "explanation": "Slides 15-16: the evolutionary rate hypothesis says warm temperatures raise mutation rates and shorten generations, so speciation should be fastest in the tropics. Finding an inverse gradient in fishes contradicts that; the lecture suggests tropical richness may instead reflect lower extinction rates.", "t": 8, "src": "08:15-16"},
  {"q": "Using the lecture's faucet-and-bucket analogy, the historical perturbation hypothesis explains the latitudinal gradient by saying that:", "c": ["The tropical faucet is fed by more solar energy and water, so it runs faster", "The tropical faucet runs faster because warm temperatures raise mutation rates", "The high-latitude bucket was tipped over by recent glaciation and has not had time to refill", "The tropical bucket is larger because the tropics are the largest biome", "The high-latitude bucket leaks faster because of intense interspecific competition"], "correct": 2, "explanation": "Slides 12 and 17: speciation is the faucet and the environment's capacity is the bucket. Historical perturbation says high latitudes have not had enough time since the last glaciation (ended ~12,000 years ago) to recolonize and reach equilibrium, whereas the tropics have been climatically stable. The faster-faucet and bigger-bucket answers describe the evolutionary-rate and geographic-area hypotheses.", "t": 8, "src": "08:12,17-18"},
  {"q": "Two nature reserves sit in the same forest type and climate and are equally isolated. Reserve A is 100 acres and Reserve B is 10,000 acres. Based on the species-area curve, which prediction is correct?", "c": ["Area affects evenness but not the number of species", "Reserve B supports 100 times as many species, because richness is directly proportional to area", "Reserve B supports more species than Reserve A, because, all else being equal, more area means more species", "Reserve A supports more species because competition is weaker in small areas", "Both support the same number of species because they share the same forest type"], "correct": 2, "explanation": "Slides 25-26: the species-area curve shows that, all else being equal, more area = more species. The curve rises and flattens rather than being a straight proportional line, so richness in B is higher but not 100-fold higher.", "t": 8, "src": "08:25-26"},
  {"q": "In MacArthur and Wilson's model, why does the immigration rate of NEW species to an island decline as the island accumulates species?", "c": ["The mainland source pool shrinks as its species move to the island", "Extinction on the island removes species faster than new ones can arrive", "Fewer and fewer arrivals belong to species that are not already on the island", "Established species physically block new colonists from landing on the island", "Islands become effectively smaller as they fill up with species"], "correct": 2, "explanation": "Slide 30: as the island holds more of the P species found on the mainland, the probability that a new arrival is a species not already there declines, so the immigration curve falls, reaching zero when every mainland species is present. The mainland pool itself does not change.", "t": 8, "src": "08:29-30"},
  {"q": "According to the lecture, extinction rates on an island INCREASE as the number of species on the island grows because:", "c": ["Interspecific competition intensifies and average population sizes shrink", "Predators tend to immigrate last and eliminate the earlier colonists", "Immigration stops completely once richness is high, so losses are not replaced", "Mutation rates rise in crowded communities, producing more harmful alleles", "The island's usable area decreases as more species occupy it"], "correct": 0, "explanation": "Slide 32 gives the two reasons: with more species, interspecific competition gets more intense, and the island's resources are divided among more species so each population is smaller and more vulnerable to chance extinction.", "t": 8, "src": "08:31-32"},
  {"q": "An island has reached its equilibrium species richness (Ŝ). Over the following decade, surveys show about 50 species every year, but several of the species present at the start are gone and have been replaced by others. This observation shows that at Ŝ:", "c": ["Both the immigration rate and the extinction rate have fallen to zero", "The island is still filling with species and has not actually reached equilibrium", "The island has reached the mainland total P, so no new species can arrive", "Immigration equals extinction, so species turn over while the number of species stays constant", "Island size must have changed, because species composition does not change at equilibrium"], "correct": 3, "explanation": "Slides 33-34: Ŝ is the point where immigration equals extinction, a dynamic equilibrium. The count of species stays roughly constant while identities change at the equilibrium rate of turnover: new species arrive at the same rate others go extinct.", "t": 8, "src": "08:27,33-34"},
  {"q": "Two islands are the same size. Island N is 5 km from the mainland and Island F is 500 km away. A bird species on each island has crashed to a few individuals after a storm. Which outcome does island biogeography predict, and what is the mechanism?", "c": ["Island N's population is more likely to persist, because mainland immigrants replenish it (rescue effect)", "Both are equally likely to persist, because island size, not distance, controls extinction", "Neither can persist, because populations reduced to a few individuals are doomed to extinction", "Island F's population is more likely to persist, because distant islands have fewer competitors", "Island N's population is more likely to go extinct, because immigrants bring new competitors"], "correct": 0, "explanation": "Slides 36-39: near islands have higher immigration, and slide 39 notes define the rescue effect: immigration can reduce a species' risk of extinction because new individuals replenish a declining population. Far islands get few immigrants, so their small populations are more likely to be lost.", "t": 8, "src": "08:35-39"},
  {"q": "Simberloff and Wilson fumigated small mangrove islands in the Florida Keys with methyl bromide to remove all arthropods, then counted species as they recolonized. Which result did the lecture present as support for the island biogeography model?", "c": ["Richness kept increasing without limit, showing that islands have no equilibrium richness", "All islands ended with exactly the same number of species regardless of distance from the mainland", "Richness returned to about pre-fumigation levels, highest on the near island and lowest on the far island", "No species recolonized any island, showing that extinction on islands is permanent", "The farthest island recovered fastest because it had the least competition"], "correct": 2, "explanation": "Slides 42-45: after defaunation, arthropod richness on each island climbed back toward its original equilibrium, and the ranking by distance held (near > intermediate > far), matching the model's prediction that immigration declines with distance.", "t": 8, "src": "08:42-45"},
  {"q": "In a long-term forest fragment study, researchers tracked bird species in 1-hectare, 10-hectare and 100-hectare fragments isolated by pasture. After 15 years the 1-ha fragments had lost about half their species, the 10-ha fragments about a quarter, and the 100-ha fragments only a few percent. This pattern illustrates that:", "c": ["The 1-ha fragments had the highest immigration rate of new species", "Fragment size does not matter once a patch is isolated by pasture", "Larger fragments lose species faster because they contain more species to lose", "Smaller fragments lose species faster, like small islands with high extinction rates", "Species loss is caused by the latitudinal gradient rather than by fragment size"], "correct": 3, "explanation": "Slide 46: habitat size also predicts rates of species loss. Small fragments behave like small islands (slide 32): populations are small and competition intense, so extinction rates are high and richness declines fastest. This is why total area split into small isolated pieces loses more species than one large patch (iClicker 3, slides 50-51).", "t": 8, "src": "08:46,50-51"},
  {"q": "Golden lion tamarins were confined to a small Brazilian reserve separated from a large intact forest by cattle pasture. Conservationists bought about 100 acres of the pasture and let it reforest. Why was this a cost-effective conservation action?", "c": ["Reforesting the pasture raised extinction rates in the intact forest, pushing tamarins into the reserve", "Buying the pasture prevented the mainland species pool from shrinking further", "The strip became a corridor to intact forest, expanding usable habitat about 10-fold for the price of 100 acres", "The 100 acres themselves provided enough new habitat to double the tamarin population", "Cattle pasture is better tamarin habitat than forest once the cattle are removed"], "correct": 2, "explanation": "Slide 47 and notes: corridors are cheaper than buying huge land parcels; the 100-acre corridor reconnected the reserve to a large forest, increasing the tamarins' available habitat to about 50,000 acres, a tenfold gain. Corridors work by raising landscape connectivity (slide 48), not by the corridor's own area.", "t": 8, "src": "08:47-48"},
  {"q": "A pond sample contains four zooplankton species with 25 individuals each (100 individuals total). Using the Shannon index H′ = −Σ pᵢ ln pᵢ (note: ln 0.25 ≈ −1.386), what is H′ for this sample?", "c": ["≈ 1.39", "≈ 0.69", "≈ 4.00", "≈ 1.61", "≈ 0.25"], "correct": 0, "explanation": "Each species has pᵢ = 25/100 = 0.25, so each term is −(0.25 × ln 0.25) = −(0.25 × −1.386) = 0.3466; four identical terms sum to H′ ≈ 1.39. For S equally abundant species H′ = ln S, and ln 4 ≈ 1.39, the maximum possible for four species (slides 21-23).", "t": 8, "src": "08:21-23"},
  {"q": "Community P has 2 species, each making up 50% of individuals. Community Q has 3 species with proportions 0.90, 0.05 and 0.05. Which community has the higher Shannon diversity (H′), and what does the comparison show?", "c": ["Community P, because H′ is highest when one species dominates", "Community P (H′ ≈ 0.69 vs ≈ 0.39): its higher evenness outweighs Q's higher richness", "Community Q, because H′ depends only on species richness", "Community Q (H′ ≈ 0.69 vs ≈ 0.39): adding rare species always raises H′ more than evenness does", "They are equal, because both have fewer than four species"], "correct": 1, "explanation": "P: −2 × (0.5 × ln 0.5) = −2 × (0.5 × −0.693) ≈ 0.69. Q: −[0.9 × ln 0.9 + 2 × (0.05 × ln 0.05)] = −[0.9 × (−0.105) + 2 × (0.05 × −2.996)] ≈ 0.095 + 0.300 ≈ 0.39. Diversity combines richness and evenness (slide 21); a very uneven community can score lower than a smaller, even one.", "t": 8, "src": "08:21-23"},
  {"q": "On a graph of immigration and extinction rates versus number of species, two islands of identical size are plotted. Island X's immigration curve lies entirely above Island Y's, while their extinction curves are identical. Which statement is correct?", "c": ["Island Y will have higher equilibrium richness because low immigration reduces competition", "Island X is closer to the mainland and will have a higher equilibrium species richness than Island Y", "Both islands have the same equilibrium richness because their extinction curves are identical", "Island X is larger than Island Y, which is why its immigration curve is higher", "Island X is farther from the mainland and will have a higher equilibrium species richness"], "correct": 1, "explanation": "Slides 35-38: distance from the source shifts the immigration curve (near = higher), while island size shifts the extinction curve. With the same extinction curve, the higher immigration curve crosses it farther to the right, so the near island (X) has the higher Ŝ.", "t": 8, "src": "08:35-38"},
  {"q": "Which statement best captures what makes ecosystem ecology different from community ecology?", "c": ["It studies the abiotic environment rather than the organisms that live in it", "It is restricted to very large areas such as deserts, oceans and whole continents", "It focuses on the flow of energy and cycling of materials between organisms and their physical environment", "It studies the interactions among populations of different species living in the same place", "It examines how individual organisms respond physiologically to temperature and moisture"], "correct": 2, "explanation": "An ecosystem is the organisms plus the physical environment they live in; ecosystem ecology is about the processes that link them, namely the one-way flow of energy and the cycling of materials (C, N, P, water).", "t": 9, "src": "09:3-6"},
  {"q": "A bear eats a salmon, but only a small fraction of the chemical energy in the salmon ends up stored in bear tissue. Where did the rest go, and which law of thermodynamics accounts for it?", "c": ["It was destroyed during digestion, consistent with the First Law", "It was stored in the soil as nutrients and recycled to plants, consistent with the First Law", "It was reflected back into space, consistent with the Second Law", "It was converted to heat during metabolic transformations and dissipated, consistent with the Second Law", "It was passed to the bear's offspring with 100% efficiency, consistent with the Second Law"], "correct": 3, "explanation": "The Second Law says that every energy transformation makes some energy unusable: it is lost as heat. That is why energy transfer between trophic levels is inefficient (roughly 90% lost at each step).", "t": 9, "src": "09:7-9"},
  {"q": "A carbon atom in a maple leaf is eaten by a caterpillar, excreted, decomposed, and years later taken up by another maple tree. The chemical energy that was in that same leaf, however, can never return to a plant. Why?", "c": ["Carbon is a gas, so it moves through the ecosystem much faster than chemical energy can move", "Decomposers return atoms to inorganic pools that producers reuse, but energy lost as heat cannot be recaptured", "Energy is recycled by decomposers, but the carbon leaves the ecosystem permanently as CO2 in the air", "Plants absorb heat from the soil and convert it back into chemical energy during photosynthesis", "Both matter and energy are recycled, but energy completes its cycle far more slowly than carbon does"], "correct": 1, "explanation": "Matter cycles: decomposers return C, N and P to inorganic pools that producers take up again. Energy flows one way: sun to producers to consumers to heat, and must be continuously resupplied by the sun.", "t": 9, "src": "09:9-12"},
  {"q": "In a forest, ecologists estimate NPP at 1,000 g C per m2 per year, but herbivores eat only about 100 g C per m2 per year of living plant tissue. What happens to most of the remaining plant production?", "c": ["It is respired by the plants themselves, so it was never counted as part of NPP", "It is lost directly from the leaves as heat during photosynthesis", "It is converted to inorganic nutrients inside the guts of the herbivores", "It is mostly added to standing wood and stays in living trees for good", "It dies and enters the detritus pool, where fungi, bacteria and detritivores break it down"], "correct": 4, "explanation": "Only about 10% of NPP goes up the grazing (green) pathway; roughly 90% of plant production dies and is processed by the detrital (brown) food web, whose decomposers return inorganic nutrients to producers.", "t": 9, "src": "09:10-12"},
  {"q": "Flux-tower measurements show that a pine plantation fixes 2,600 g C per m2 per year through photosynthesis (GPP) and that the trees respire 1,450 g C per m2 per year. What is the plantation's NPP?", "c": ["4,050 g C per m2 per year", "1,450 g C per m2 per year", "0.56 g C per m2 per year", "1,150 g C per m2 (a total amount, not a rate)", "1,150 g C per m2 per year"], "correct": 4, "explanation": "NPP = GPP - plant respiration = 2,600 - 1,450 = 1,150 g C per m2 per year. NPP is a rate (new biomass per area per time), so the units must include time.", "t": 9, "src": "09:19-20"},
  {"q": "A grassland has an NPP of 800 g C per m2 per year. If, as in many ecosystems, the plants respire about half of the carbon they fix, what is the approximate GPP?", "c": ["400 g C per m2 per year", "800 g C per m2 per year", "1,200 g C per m2 per year", "1,600 g C per m2 per year", "8,000 g C per m2 per year"], "correct": 3, "explanation": "Because NPP = GPP - R and R is about half of GPP, NPP is about 50% of GPP. So GPP is roughly 2 x 800 = 1,600 g C per m2 per year.", "t": 9, "src": "09:19-20"},
  {"q": "A salt marsh has an NPP of 5,000 kcal per m2 per year. Using the ~10% rule, about how much energy per m2 per year ends up in the tissue of secondary consumers (the carnivores that eat the marsh's herbivores)?", "c": ["2,500 kcal per m2 per year", "500 kcal per m2 per year", "50 kcal per m2 per year", "5 kcal per m2 per year", "0.5 kcal per m2 per year"], "correct": 2, "explanation": "NPP is the energy available to herbivores. Two transfers at about 10% each: 5,000 to 500 (primary consumers) to 50 kcal per m2 per year (secondary consumers); about 90% is lost as heat at each step.", "t": 9, "src": "09:9-10, 19"},
  {"q": "Which ordering of ecosystems, from HIGHEST to LOWEST NPP per unit area, matches the pattern shown in lecture?", "c": ["Freshwater swamp > coral reef > open ocean", "Open ocean > coral reef > freshwater swamp", "Coral reef > open ocean > freshwater swamp", "Open ocean > freshwater swamp > coral reef", "Tundra > tropical forest > desert"], "correct": 0, "explanation": "Among aquatic ecosystems, freshwater swamps are the most productive, followed by coral reefs; the open ocean has the lowest NPP per area because dissolved nutrients are scarce. On land, tropical forests are highest and deserts and tundra lowest.", "t": 9, "src": "09:23"},
  {"q": "A graph of terrestrial NPP against mean annual precipitation rises steeply, flattens, and then declines at the very wettest sites. Which statement best explains the decline at the wet end?", "c": ["Rainfall dissolves soil nutrients so completely that photosynthesis becomes impossible", "Persistent cloud cover lowers solar input, and water-saturated soils lack oxygen for roots", "Very wet sites are found at high latitudes where temperatures are too low for growth", "Herbivores eat more biomass in wet climates, which lowers GPP", "Decomposition stops in wet soils, so nutrients are never released"], "correct": 1, "explanation": "On land NPP rises with temperature and with precipitation up to roughly 200-240 cm per year, then falls in extremely wet climates, probably because of more cloud cover (less light) and oxygen-poor waterlogged soils.", "t": 9, "src": "09:25"},
  {"q": "The oceans cover far more of Earth than land, yet they account for only about 46% of global NPP. Which combination of factors best explains this?", "c": ["Low water temperatures and a shortage of dissolved CO2 in seawater limit photosynthesis", "High salinity across most of the open ocean prevents phytoplankton from carrying out photosynthesis", "Too few herbivores graze the phytoplankton, so their populations stop growing", "Light is absorbed within the upper water column, and the open ocean is poor in dissolved nitrogen and phosphorus", "Hydrothermal vents consume most of the nutrients before they can reach surface waters"], "correct": 3, "explanation": "Half of incoming sunlight is absorbed in the top ~15 m, so photosynthesis is confined to a thin surface layer, and the open ocean is very low in N and P. High marine NPP is restricted to coasts (runoff) and upwelling zones.", "t": 9, "src": "09:26-28"},
  {"q": "Which statement about the global water cycle is correct?", "c": ["Most precipitation falls over land and is then carried back to the sea as surface runoff", "Transpiration moves water vapor from the atmosphere into plant leaves through the stomata", "The ocean is the largest pool, and groundwater holds far more fresh water than lakes and rivers", "Groundwater recharges almost instantly after rain, so pumping cannot deplete an aquifer", "Melting ice sheets and glaciers remove water from the ocean pool"], "correct": 2, "explanation": "Water evaporates mainly from the sea and falls as precipitation (mostly over the sea). On land it is taken up by plants and transpired, percolates into the groundwater pool (much larger than surface fresh water), or runs off back to the ocean, the largest pool (slide 35 notes).", "t": 9, "src": "09:35"},
  {"q": "North-central Florida draws its water from the Floridan Aquifer. Which scenario correctly links a human activity to its effect on the water cycle as described in lecture?", "c": ["Clearing forest for pasture increases the water retained in soil and groundwater, raising aquifer recharge", "Pumping groundwater faster than it recharges draws down ancient 'fossil' water that took millennia to accumulate", "Sea-level rise lowers the coastal water table, which protects freshwater aquifers from saltwater intrusion", "Replacing vegetation with pavement increases transpiration, which cools the city and adds to rainfall", "Deforestation increases the precipitation retained by soils because trees no longer intercept the rain"], "correct": 1, "explanation": "Removing vegetation increases surface runoff and dries local ecosystems; overdrawing aquifers depletes 'fossil' water that took millennia to accumulate; and warming raises sea level, which increases the threat of saltwater intrusion into Florida's coastal freshwater aquifers (slides 37-39).", "t": 9, "src": "09:37-39"},
  {"q": "Although N2 makes up 78% of the atmosphere, most organisms cannot use it. Which statement correctly describes how nitrogen enters and leaves the biologically available pool?", "c": ["Plants absorb N2 directly through their stomata, and animals return it to the air whenever they exhale", "Lightning is the main natural pathway that converts N2 into the nitrate forms that plants can take up", "Rock weathering supplies most of the new nitrogen that enters ecosystems, just as it does for phosphorus", "Only certain microbes can break the N2 triple bond (fixation), and other microbes return N2 by denitrification", "Decomposers convert soil nitrate into N2 gas, which plant roots then absorb directly from the soil air"], "correct": 3, "explanation": "The triple bond of N2 makes it inaccessible; nitrogen-fixing microbes (on land and in the sea) convert it to usable forms, and denitrifying microbes reverse the process, returning N2 to the atmosphere. Most plant N is recycled locally through dead organic matter.", "t": 9, "src": "09:45"},
  {"q": "Which statement about human alteration of the nitrogen cycle is supported by lecture?", "c": ["Humans have drawn the atmospheric N2 pool down to dangerously low levels through fertilizer production", "Human nitrogen inputs are mostly buried in sedimentary rock, where they stay locked up for millions of years", "Fertilizer manufacture plus nitrogen-fixing crops like soybeans now fix about as much N as natural terrestrial fixation", "Nitrous oxide (N2O) released from fertilized soils is a weak greenhouse gas with little effect on the climate", "Excess nitrogen carried by rivers suppresses algal growth in the coastal waters and lakes that receive it"], "correct": 2, "explanation": "Industrial fixation (fertilizer, explosives) and agricultural fixation by legume crops together exceed natural terrestrial N fixation. The extra N causes smog, acid rain, N2O (a greenhouse gas roughly 300 times as potent as CO2), and eutrophication.", "t": 9, "src": "09:46-47"},
  {"q": "At Hubbard Brook, one forested watershed was clear-cut while a neighboring watershed was left intact. Nitrate in the stream draining the cut watershed rose about 60-fold. Which explanation and design feature are correct?", "c": ["Cutting the trees stopped decomposition, so nitrogen built up in the soil and then leached out; the second watershed was an unnecessary extra", "Logging machinery added nitrogen fertilizer to the soil; the intact watershed served as a second replicate of the clear-cut treatment", "Decomposition kept releasing nutrients but no living roots remained to take them up, so nitrate leached to the stream; the intact watershed was the control", "Without shade the stream warmed and warm water holds more dissolved nitrate; the control watershed had also been cut", "Clear-cutting boosted nitrogen fixation by sun-loving legumes; the intact watershed simply received the extra runoff from the cut one"], "correct": 2, "explanation": "Living roots act as a nutrient sponge. After clear-cutting, decomposition continued but nothing took the nutrients up, so they hemorrhaged into the stream. Comparing with an uncut control watershed let Likens and colleagues isolate the effect of vegetation removal.", "t": 9, "src": "09:49"},
  {"q": "Peat bogs in cool, waterlogged landscapes store organic matter for thousands of years, while leaf litter in a warm, moist tropical forest disappears within months. Which statement best explains the difference?", "c": ["Tropical litter contains almost no carbon, so there is nothing left for the soil to store", "Decomposition speeds up steeply with temperature, and waterlogged soils turn anaerobic, which suppresses the aerobic decomposers", "Tropical forests have no decomposers, so litter is eaten entirely by herbivores instead", "Cold temperatures accelerate microbial decomposition, but the standing water dilutes the nutrients that are released", "Peat forms because bog plants have far higher NPP than tropical plants and so produce much more litter"], "correct": 1, "explanation": "Temperature is the primary driver of decomposition (it roughly quadruples for every 10 degrees C, Q10 of about 4); microbes also need water, but too much water makes soils anaerobic and slows decay, so peatlands and boreal soils accumulate deep organic layers while tropical soils stay thin (slide 13 notes).", "t": 9, "src": "09:13"},
  {"q": "Phosphate fertilizer applied to a Florida farm runs off into a river and eventually settles into ocean sediments. According to lecture, on what timescale will that phosphorus naturally return to land where it could be used again?", "c": ["Within one growing season, through evaporation from the sea and return in rainfall", "Within decades, through denitrification carried out by marine microbes", "Within centuries, through upwelling that carries it back onto the coastlines", "Over millions of years, by burial in sedimentary rock followed by geological uplift", "Never, because phosphorus is chemically destroyed once it reaches ocean sediments"], "correct": 3, "explanation": "Phosphorus has no significant gaseous phase. Once it reaches marine sediments it is locked in sedimentary rock and returns to land only through uplift, a process operating over millions of years, which is why mined phosphorus is effectively non-renewable.", "t": 10, "src": "10:7, 10:9"},
  {"q": "According to lecture, why is phosphorus essential to every cell?", "c": ["It forms the peptide backbone of the proteins in a cell", "It is the central atom of the chlorophyll molecule in chloroplasts", "It is a component of phospholipid membranes and of ATP, which fuels cellular work", "It is the gas that plants fix during photosynthesis to build sugars", "It supplies the triple bond that holds nitrogen gas together"], "correct": 2, "explanation": "Phosphorus builds the phospholipid bilayer of every membrane and is part of ATP, the energy currency of cells; that is why P is often a limiting nutrient and why its slow cycle matters.", "t": 10, "src": "10:5-6"},
  {"q": "Which statement about phosphorus as a resource for agriculture is consistent with lecture?", "c": ["Phosphorus fertilizer can be manufactured from an atmospheric gas, just as nitrogen fertilizer is made from N2", "Most mined phosphorus is efficiently recycled from fields and waterways back to the farms that need it", "Phosphorus cycles faster than carbon or nitrogen because it dissolves so readily in water and moves with it", "Phosphorus is a finite resource with no substitute in agriculture, and most of what is mined ends up in waterways", "Concerns about 'peak phosphorus' were resolved by the discovery of a large atmospheric phosphorus pool"], "correct": 3, "explanation": "Phosphate rock reserves are finite and there is no atmospheric pool to draw on; most mined P travels one way from mine to farm to waterway to ocean sediment, so recovery and recycling technologies are increasingly important (slide 9).", "t": 10, "src": "10:9"},
  {"q": "Which pair correctly matches a carbon-cycle process with the direction of the carbon transformation?", "c": ["Photosynthesis: organic carbon to inorganic CO2; respiration: inorganic CO2 to organic compounds", "Photosynthesis: inorganic CO2 to organic compounds; respiration: organic carbon oxidized back to CO2", "Both photosynthesis and respiration convert inorganic CO2 into organic carbon compounds", "Decomposition converts atmospheric CO2 directly into carbonate rock on the seafloor", "Burning fossil fuels converts atmospheric CO2 into organic carbon stored underground"], "correct": 1, "explanation": "Primary producers fix inorganic CO2 into organic macromolecules; organisms then obtain energy by oxidizing organic carbon back to CO2 in respiration. All macromolecules in living things contain carbon.", "t": 10, "src": "10:13-14"},
  {"q": "According to the global carbon cycle figure shown in lecture, which of the following reservoirs holds the most carbon? (Carbonate rocks, the largest pool of all, are not among the choices.)", "c": ["Atmosphere", "Plant biomass", "Soils", "Fossil fuels", "Ocean waters"], "correct": 4, "explanation": "Ocean waters hold about 38,920 Pg of carbon (as dissolved CO2, bicarbonate and carbonate), far more than the atmosphere (~760), plant biomass (~650), soils (~1,500) and fossil fuels (~3,700) combined; only carbonate rocks (~18 million Pg) are larger. The ocean is also the largest sink for added CO2, but its capacity is finite (slides 19, 22).", "t": 10, "src": "10:18-19, 10:22"},
  {"q": "Lecture classified the fluxes of carbon as biological, chemical, or physical. Which set of examples is correctly classified?", "c": ["Biological: outgassing of CO2 from the ocean surface; chemical: photosynthesis by land plants; physical: formation of carbonate ions in seawater", "Biological: burning of fossil fuels for energy; chemical: photosynthesis by phytoplankton; physical: respiration by animals and soil microbes", "Biological: photosynthesis and respiration; chemical: formation of carbonate ions in seawater; physical: CO2 dissolving in and outgassing from the ocean", "Biological: weathering of carbonate rock on land; chemical: outgassing of CO2 from seawater; physical: decomposition of leaf litter by fungi", "Biological: precipitation of carbonate minerals; chemical: respiration of glucose by animals; physical: photosynthesis in the leaves of plants"], "correct": 2, "explanation": "Carbon moves between pools by biological processes (photosynthesis, respiration, decomposition), chemical processes (carbonate chemistry in the ocean) and physical processes (CO2 dissolving into and outgassing from seawater).", "t": 10, "src": "10:15-16"},
  {"q": "Why is carbon released by burning coal and oil described as 'new' carbon added to the active carbon cycle?", "c": ["Coal and oil contain a different isotope of carbon that neither plants nor the ocean are able to take up", "Fossil carbon came from organisms buried millions of years ago and was not exchanging with the atmosphere until burned", "Fossil fuels release methane rather than CO2 when burned, and methane is not part of the carbon cycle", "The ocean cannot absorb CO2 that comes from fossil fuels, so every bit of it remains in the atmosphere", "Carbon from fossil fuels is created during combustion rather than being transferred from one pool to another"], "correct": 1, "explanation": "Before industrialization the fossil fuel reservoir sat outside the atmosphere-ocean-land exchange. Burning it moves ancient carbon into the atmosphere faster than natural sinks can absorb it, raising atmospheric CO2; fossil fuels are non-renewable.", "t": 10, "src": "10:20-21"},
  {"q": "A classmate argues, 'Extra CO2 will just make plants grow more, and they will absorb it all.' Which rebuttal is consistent with lecture?", "c": ["Plants cannot use CO2 at concentrations above pre-industrial levels, so the extra CO2 is simply ignored by them", "Plants take up carbon mainly from the soil rather than the atmosphere, so atmospheric CO2 is irrelevant to them", "Growth in many ecosystems is limited by N, P or water rather than CO2, and more biomass also raises soil respiration", "Extra CO2 makes the ocean absorb less carbon, so plants would have to remove all of the added carbon by themselves", "Photosynthesis shuts down once CO2 exceeds 400 ppm, so plants will stop growing altogether as CO2 keeps rising"], "correct": 2, "explanation": "Tropical plants are often N- or P-limited and tundra plants water-limited, climate change is worsening drought stress, and more biomass means more soil respiration, so CO2 fertilization cannot absorb the fossil carbon humans add.", "t": 10, "src": "10:24"},
  {"q": "According to the carbon-cycle simulation discussed in lecture, what happens to atmospheric CO2 after fossil fuel reserves are exhausted and emissions stop?", "c": ["It returns to pre-industrial levels within a few years because the ocean quickly absorbs the added carbon", "It keeps rising indefinitely, even with zero emissions, because the ocean begins to release its stored carbon", "It drops to near zero because plants fix whatever CO2 remains once new emissions have come to a stop", "It stays exactly where it was because carbon from fossil fuels never entered the atmosphere in the first place", "It settles at a new, higher equilibrium because the added carbon is redistributed among reservoirs, not destroyed"], "correct": 4, "explanation": "Carbon is conserved: it moves among reservoirs but the total never changes. The ocean is the largest sink but its uptake slows as it fills (and acidifies), so the system reaches a new, higher equilibrium rather than returning to pre-industrial CO2.", "t": 10, "src": "10:22"},
  {"q": "Which of the following is the best example of an ecosystem FUNCTION as the term was defined in lecture?", "c": ["The total number of tree species living in a forest, as counted in a single survey", "The clean drinking water that a city draws from the forested watershed upstream of it", "The decomposition of leaf litter by soil fungi, which moves nutrients through the forest", "A state rule that limits how many deer each hunter may take during the fall season", "The scenic value that visitors place on a stand of old-growth forest they hike through"], "correct": 2, "explanation": "An ecosystem function is an ecological process that controls the fluxes of energy, nutrients and organic matter through an environment (slide 30). Clean drinking water is a benefit humans derive from such processes, i.e. an ecosystem service (slide 31); species counts, rules and scenic values are not processes.", "t": 10, "src": "10:30-31"},
  {"q": "At Cedar Creek, plots were planted with 1, 2, 4, 8 or 16 species and ecosystem functions such as biomass production were measured. Which description of the relationship between species number and ecosystem function is consistent with those results and with the Cardinale et al. (2012) meta-analysis of hundreds of experiments?", "c": ["Function rises fastest when species are added to already species-rich plots (accelerating)", "Function is unrelated to the number of species", "Function declines as species are added because competition intensifies", "Function is highest in a monoculture of the single most productive species", "Function rises steeply with the first few species added and then levels off (saturating)"], "correct": 4, "explanation": "The biggest gains in ecosystem function come from the first few species; beyond that, returns diminish. This saturating curve held across ecosystems, trophic levels and functions in the meta-analysis.", "t": 10, "src": "10:36-41"},
  {"q": "A saturating biodiversity-ecosystem function curve is read from right to left to represent biodiversity loss. Which conclusion follows?", "c": ["The first species lost from a diverse community causes the largest drop in function of all", "Losing species has no effect on function until the very last species is gone", "Each additional loss causes a progressively larger drop, so the last few species carry most of the function", "Function increases as species are lost because resources are freed up for the survivors", "Species losses matter only in monocultures, where there is nothing to replace the lost species"], "correct": 2, "explanation": "Because the curve is flat at high richness and steep at low richness, early losses barely register but later losses are catastrophic: each species lost matters more than the last, which is why the strongest effects occur at low species numbers.", "t": 10, "src": "10:40"},
